<title>Dice &amp; Chain Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: one full-height canvas, capped at phone-tablet width. HUD on top, play field in the middle, dice tray at the bottom. */
:root {
  --void: #07060f;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--void);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.stage { position: relative; height: 100%; max-width: 520px; margin: 0 auto; }
#game { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
</style>

<div class="stage" id="stage">
  <canvas id="game" tabindex="0" aria-label="Dice and Chain Defense. Tap a die to cast it, drag matching dice together to merge them."></canvas>
</div>

<script>
(function () {
  // ---- Config ----------------------------------------------------------
  // Put your character art here (a URL or data: URI) to replace the glowing orb.
  const CHARACTER_IMAGE = "";
  const BEST_KEY = "dice-chain-best-v1";

  const SLOT_COUNT = 5;
  const DROP_EVERY = 3;       // seconds between dice drops
  const RAGE_TIME = 5;        // seconds of Rage Mode
  const RAGE_SLOWMO = 0.28;   // world speed during Rage Mode
  const COMBO_WINDOW = 2.5;   // seconds to keep a combo alive
  const MAX_HP = 100;
  const MAX_TIER = 3;

  const FONT = '"Chakra Petch", "Segoe UI", system-ui, sans-serif';
  const EL = {
    fire: { label: "FIRE", note: "splash damage", c: "#ff4766", c2: "#ffb23f" },
    ice:  { label: "ICE",  note: "freeze + slow", c: "#3fe0ff", c2: "#d4f8ff" },
    bolt: { label: "BOLT", note: "chain shock",   c: "#ffe14d", c2: "#fffbd1" }
  };
  const ELS = ["fire", "ice", "bolt"];
  const ENEMY = {
    crawler: { r: 13, hp: 30,  speed: 40, dmg: 8,  pts: 10, c: "#ff3df0" },
    runner:  { r: 9,  hp: 16,  speed: 80, dmg: 6,  pts: 15, c: "#7dff5a" },
    brute:   { r: 21, hp: 150, speed: 24, dmg: 20, pts: 50, c: "#ff7a2f" }
  };
  // Spell numbers by tier (index 1..3)
  const FIRE = { R: [0, 70, 105, 165], dmg: [0, 38, 95, 260] };
  const ICE  = { R: [0, 85, 130, 210], dmg: [0, 10, 26, 70], freeze: [0, 1.6, 2.6, 4.2] };
  const BOLT = { chains: [0, 3, 6, 12], dmg: [0, 30, 72, 180], range: [0, 150, 175, 220] };

  // ---- Setup -----------------------------------------------------------
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tg = window.Telegram && window.Telegram.WebApp;

  let coreImg = null;
  if (CHARACTER_IMAGE) { coreImg = new Image(); coreImg.src = CHARACTER_IMAGE; }

  let best = 0;
  try { best = +localStorage.getItem(BEST_KEY) || 0; } catch (e) {}

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const ease = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const alphaCache = {};
  function rgba(hex, a) {
    const k = hex + a;
    if (alphaCache[k]) return alphaCache[k];
    const n = parseInt(hex.slice(1), 16);
    return (alphaCache[k] = `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`);
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function font(weight, size) { ctx.font = `${weight} ${size}px ${FONT}`; }
  function spacing(px) { if ("letterSpacing" in ctx) ctx.letterSpacing = px + "px"; }

  function haptic(kind) {
    try {
      const h = tg && tg.HapticFeedback;
      if (!h) return;
      if (kind === "error") h.notificationOccurred("error");
      else if (kind === "success") h.notificationOccurred("success");
      else h.impactOccurred(kind);
    } catch (e) {}
  }

  // ---- Layout ----------------------------------------------------------
  let W, H, dpr, S, cx, cy, coreR, hudH, trayTop, slotSize, slotGap, slotX0, slotY, bg;
  function layout() {
    W = stage.clientWidth;
    H = stage.clientHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    hudH = 78;
    slotGap = 10;
    slotSize = Math.min(68, (W - 32 - slotGap * (SLOT_COUNT - 1)) / SLOT_COUNT);
    trayTop = H - (slotSize + 48);
    slotX0 = (W - (SLOT_COUNT * slotSize + (SLOT_COUNT - 1) * slotGap)) / 2;
    slotY = trayTop + 32;
    cx = W / 2;
    cy = (hudH + trayTop) / 2 + 6;
    S = clamp(Math.min(W, trayTop - hudH) / 400, 0.8, 1.5);
    coreR = clamp(Math.min(W, trayTop - hudH) * 0.07, 22, 34);
    buildBg();
  }
  function buildBg() {
    bg = document.createElement("canvas");
    bg.width = canvas.width; bg.height = canvas.height;
    const b = bg.getContext("2d");
    b.scale(dpr, dpr);
    const g = b.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0d0820"); g.addColorStop(1, "#05040b");
    b.fillStyle = g; b.fillRect(0, 0, W, H);
    // neon grid
    b.strokeStyle = "rgba(140,90,255,0.07)"; b.lineWidth = 1;
    const step = 32;
    for (let x = (cx % step); x < W; x += step) { b.beginPath(); b.moveTo(x + 0.5, 0); b.lineTo(x + 0.5, H); b.stroke(); }
    for (let y = (cy % step); y < H; y += step) { b.beginPath(); b.moveTo(0, y + 0.5); b.lineTo(W, y + 0.5); b.stroke(); }
    // core glow + target rings
    const rg = b.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.6);
    rg.addColorStop(0, "rgba(60,100,255,0.16)"); rg.addColorStop(0.4, "rgba(120,40,200,0.05)"); rg.addColorStop(1, "rgba(0,0,0,0.5)");
    b.fillStyle = rg; b.fillRect(0, 0, W, H);
    b.strokeStyle = "rgba(63,224,255,0.08)";
    for (let i = 1; i <= 4; i++) { b.beginPath(); b.arc(cx, cy, coreR * 2.2 * i, 0, Math.PI * 2); b.stroke(); }
    // scanlines
    b.fillStyle = "rgba(0,0,0,0.18)";
    for (let y = 0; y < H; y += 3) b.fillRect(0, y, W, 1);
  }

  // ---- State -----------------------------------------------------------
  let state = "title", stateT = 0, now = 0;
  let hp, score, shownScore, combo, comboT, comboPop, bestCombo, kills, elapsed, wave, spawnT, dropT;
  let slots, enemies, projectiles, particles, texts, rings, bolts, blade, rage, timeScale, shake, flash, flashColor, coreKick, newBest, banner;
  const ptr = { down: false, id: null, x: 0, y: 0, sx: 0, sy: 0, slot: -1, dragging: false, lx: 0, ly: 0, lastBuzz: 0 };

  const die = (el, tier = 1) => ({ el, tier, drop: 0, pop: 0 });

  function reset() {
    hp = MAX_HP; score = 0; shownScore = 0; combo = 0; comboT = 0; comboPop = 0; bestCombo = 0; kills = 0;
    elapsed = 0; wave = 1; spawnT = 1.2; dropT = 0;
    slots = new Array(SLOT_COUNT).fill(null);
    slots[0] = die("fire"); slots[1] = die("bolt");
    enemies = []; projectiles = []; particles = []; texts = []; rings = []; bolts = []; blade = [];
    rage = null; timeScale = 1; shake = 0; flash = 0; flashColor = "#ffffff"; coreKick = 0; newBest = false;
    banner = { text: "WAVE 1", t: 1.6 };
  }

  // ---- Spawning --------------------------------------------------------
  function spawn(forceType) {
    const t = elapsed;
    let type = "crawler";
    const r = Math.random();
    if (forceType) type = forceType;
    else if (t > 40 && r < 0.14) type = "brute";
    else if (t > 18 && r < 0.42) type = "runner";
    const d = ENEMY[type];
    const hpScale = 1 + t / 70;
    const m = d.r + 4;
    let x, y;
    switch ((Math.random() * 4) | 0) {
      case 0: x = rand(0, W); y = -m; break;
      case 1: x = W + m; y = rand(0, trayTop); break;
      case 2: x = rand(0, W); y = trayTop + m; break;
      default: x = -m; y = rand(0, trayTop);
    }
    enemies.push({
      type, x, y, r: d.r, hp: d.hp * hpScale, maxHp: d.hp * hpScale,
      speed: d.speed * Math.min(1 + t / 120, 2.4) * S,
      dmg: d.dmg, pts: d.pts, c: d.c,
      frozen: 0, slow: 0, flash: 0, rot: rand(0, 6.28), dead: false
    });
  }
  const spawnInterval = () => Math.max(0.3, 1.45 - elapsed * 0.012);

  // ---- Effects ---------------------------------------------------------
  function burst(x, y, colors, n, spdMin, spdMax, life, size) {
    for (let i = 0; i < n && particles.length < 1400; i++) {
      const a = rand(0, Math.PI * 2), s = rand(spdMin, spdMax);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.5, life), max: life,
        c: pick(colors), size: rand(size * 0.5, size), sq: false, g: 0, drag: 0.9 });
    }
  }
  function pixelDust(e, n) {
    for (let i = 0; i < n && particles.length < 1400; i++) {
      const a = rand(0, Math.PI * 2), s = rand(60, 340);
      particles.push({ x: e.x + rand(-e.r, e.r), y: e.y + rand(-e.r, e.r), vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
        life: rand(0.5, 1.2), max: 1.2, c: Math.random() < 0.25 ? "#ffffff" : e.c, size: rand(2, 5), sq: true, g: 260, drag: 0.96 });
    }
  }
  function ring(x, y, R, c, life = 0.45, w = 3) { rings.push({ x, y, R, c, life, max: life, w }); }
  function addText(text, x, y, c, size, life = 0.9, vy = -60) { texts.push({ text, x, y, c, size, life, max: life, vy }); }
  function addShake(v) { shake = Math.min(24, shake + v * (reduceMotion ? 0.3 : 1)); }
  function doFlash(c, v) { flashColor = c; flash = Math.max(flash, v); }

  // ---- Combat ----------------------------------------------------------
  function nearestEnemy(x, y, exclude, maxD) {
    let bestE = null, bd = maxD * maxD;
    for (const e of enemies) {
      if (e.dead || (exclude && exclude.has(e))) continue;
      const d = (e.x - x) ** 2 + (e.y - y) ** 2;
      if (d < bd) { bd = d; bestE = e; }
    }
    return bestE;
  }

  function damage(e, amt) {
    if (e.dead) return;
    e.hp -= amt;
    e.flash = 0.12;
    if (e.hp <= 0) kill(e, "spell");
  }

  function kill(e, how) {
    if (e.dead) return;
    e.dead = true;
    kills++;
    combo++;
    comboT = COMBO_WINDOW;
    comboPop = 1;
    bestCombo = Math.max(bestCombo, combo);
    const mult = 1 + (combo - 1) * 0.1;
    const pts = Math.round(e.pts * mult * (how === "slice" ? 2 : 1));
    score += pts;
    addText("+" + pts, e.x, e.y - e.r, how === "slice" ? "#ffffff" : e.c, 15 + Math.min(combo, 20) * 0.4, 0.8);
    if (how === "slice") {
      pixelDust(e, 42);
      ring(e.x, e.y, e.r * 3, "#ffffff", 0.3, 2);
    } else {
      pixelDust(e, 14);
      burst(e.x, e.y, [e.c, "#ffffff"], 8, 40, 160, 0.5, 3);
    }
    if (combo > 1 && combo % 10 === 0) {
      addText(combo + " CHAIN!", cx, cy - coreR - 46, "#ffe14d", 30, 1.2, -30);
      haptic("success");
    }
  }

  function hitCore(e) {
    e.dead = true;
    hp = Math.max(0, hp - e.dmg);
    pixelDust(e, 18);
    addShake(10);
    doFlash("#ff2448", 0.35);
    coreKick = 1;
    combo = 0;
    addText("-" + e.dmg, cx, cy - coreR - 14, "#ff4766", 22, 0.9);
    haptic("error");
    if (hp <= 0) gameOver();
  }

  function cast(d, tx, ty) {
    if (tx == null) {
      const t = nearestEnemy(cx, cy, null, Infinity);
      if (t) { tx = t.x; ty = t.y; } else { tx = cx; ty = hudH + 30; }
    }
    coreKick = 0.6;
    haptic(d.tier >= 3 ? "heavy" : d.tier === 2 ? "medium" : "light");
    if (d.el === "bolt") { lightning(d.tier, tx, ty); return; }
    const a = Math.atan2(ty - cy, tx - cx);
    projectiles.push({ el: d.el, tier: d.tier, x: cx + Math.cos(a) * coreR, y: cy + Math.sin(a) * coreR,
      tx, ty, speed: 720 * S, r: 6 + d.tier * 3 });
  }

  function detonate(p) {
    const t = p.tier;
    if (p.el === "fire") {
      const R = FIRE.R[t] * S;
      for (const e of enemies) if (Math.hypot(e.x - p.x, e.y - p.y) < R + e.r) damage(e, FIRE.dmg[t]);
      ring(p.x, p.y, R, "#ff4766", 0.5, 4);
      ring(p.x, p.y, R * 0.6, "#ffb23f", 0.35, 3);
      burst(p.x, p.y, ["#ff4766", "#ffb23f", "#fff1c0", "#ff7a2f"], 28 * t + 10, 80, 300 + t * 80, 0.9, 5);
      addShake(3 + t * 4);
      doFlash("#ff6a3d", 0.08 * t);
    } else {
      const R = ICE.R[t] * S, fz = ICE.freeze[t];
      for (const e of enemies) {
        if (e.dead || Math.hypot(e.x - p.x, e.y - p.y) >= R + e.r) continue;
        e.frozen = Math.max(e.frozen, fz);
        e.slow = Math.max(e.slow, fz + 2.5);
        damage(e, ICE.dmg[t]);
      }
      ring(p.x, p.y, R, "#3fe0ff", 0.6, 3);
      ring(p.x, p.y, R * 0.5, "#d4f8ff", 0.4, 2);
      burst(p.x, p.y, ["#3fe0ff", "#d4f8ff", "#ffffff", "#7aa8ff"], 24 * t + 10, 60, 240 + t * 60, 1.0, 4);
      addShake(2 + t * 2);
      doFlash("#3fe0ff", 0.06 * t);
      if (t >= 2) addText("FROZEN", p.x, p.y - 20, "#d4f8ff", 16 + t * 2, 0.8);
    }
  }

  function lightning(t, tx, ty) {
    const hit = new Set();
    const pts = [{ x: cx, y: cy }];
    let cur = nearestEnemy(tx, ty, null, Infinity);
    if (!cur) {
      pts.push({ x: tx, y: ty });
      bolts.push({ pts, life: 0.3, max: 0.3, w: t });
      burst(tx, ty, ["#ffe14d", "#fffbd1"], 10, 60, 200, 0.4, 3);
      return;
    }
    const range = BOLT.range[t] * S;
    let i = 0;
    while (cur && i < BOLT.chains[t]) {
      hit.add(cur);
      pts.push({ x: cur.x, y: cur.y });
      burst(cur.x, cur.y, ["#ffe14d", "#fffbd1", "#ffffff"], 8 + t * 3, 60, 260, 0.45, 3);
      damage(cur, BOLT.dmg[t] * Math.pow(0.92, i));
      i++;
      cur = nearestEnemy(cur.x, cur.y, hit, range);
    }
    bolts.push({ pts, life: 0.35, max: 0.35, w: t });
    addShake(2 + t * 2.5);
    doFlash("#ffe14d", 0.05 * t);
    if (i >= 4) addText(i + "x CHAIN", pts[pts.length - 1].x, pts[pts.length - 1].y - 22, "#ffe14d", 18, 0.9);
  }

  // ---- Dice tray -------------------------------------------------------
  const slotRect = (i) => ({ x: slotX0 + i * (slotSize + slotGap), y: slotY, s: slotSize });
  function hitSlot(x, y, pad = 0) {
    for (let i = 0; i < SLOT_COUNT; i++) {
      const r = slotRect(i);
      if (x >= r.x - pad && x <= r.x + r.s + pad && y >= r.y - pad && y <= r.y + r.s + pad) return i;
    }
    return -1;
  }
  const canMerge = (a, b) => a && b && a !== b && a.el === b.el && a.tier === b.tier && a.tier < MAX_TIER;

  function dropDie() {
    const idx = slots.indexOf(null);
    if (idx < 0) return false;
    slots[idx] = die(pick(ELS));
    checkRage();
    return true;
  }

  function moveDie(from, to) {
    const a = slots[from], b = slots[to];
    if (!b) { slots[to] = a; slots[from] = null; }
    else if (canMerge(a, b)) {
      const m = die(a.el, a.tier + 1);
      m.drop = 1; m.pop = 1;
      slots[to] = m; slots[from] = null;
      const r = slotRect(to);
      burst(r.x + r.s / 2, r.y + r.s / 2, [EL[a.el].c, EL[a.el].c2, "#ffffff"], 30, 60, 260, 0.6, 4);
      addText("TIER " + m.tier, r.x + r.s / 2, r.y - 8, EL[a.el].c2, 18, 0.9);
      haptic("success");
    } else { slots[to] = a; slots[from] = b; }
    checkRage();
  }

  function useSlot(i, tx, ty) {
    const d = slots[i];
    if (!d) return;
    slots[i] = null;
    cast(d, tx, ty);
  }

  // Three side-by-side dice of one element trigger Rage Mode.
  function checkRage() {
    if (rage || state !== "play") return;
    for (let i = 0; i <= SLOT_COUNT - 3; i++) {
      const a = slots[i], b = slots[i + 1], c = slots[i + 2];
      if (a && b && c && a.el === b.el && b.el === c.el) { triggerRage(a.el, i); return; }
    }
  }
  function triggerRage(el, start) {
    for (let k = start; k < start + 3; k++) {
      const r = slotRect(k);
      burst(r.x + r.s / 2, r.y + r.s / 2, [EL[el].c, EL[el].c2, "#ffffff"], 26, 80, 320, 0.7, 4);
      slots[k] = null;
    }
    rage = { t: RAGE_TIME, el };
    ptr.slot = -1; ptr.dragging = false;
    blade = [];
    addShake(16);
    doFlash(EL[el].c, 0.6);
    haptic("heavy");
  }

  // ---- Game flow -------------------------------------------------------
  function startGame() { reset(); state = "play"; stateT = 0; haptic("medium"); }
  function gameOver() {
    state = "over"; stateT = 0; rage = null;
    burst(cx, cy, ["#3d7bff", "#ff4766", "#ffffff", "#3fe0ff"], 120, 80, 520, 1.4, 6);
    ring(cx, cy, Math.max(W, H), "#ff4766", 1.0, 5);
    addShake(24);
    for (const e of enemies) if (!e.dead) { e.dead = true; pixelDust(e, 10); }
    if (score > best) {
      best = score; newBest = true;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
  }

  // ---- Update ----------------------------------------------------------
  function update(dt) {
    stateT += dt;
    const tsTarget = rage ? RAGE_SLOWMO : 1;
    timeScale += (tsTarget - timeScale) * Math.min(1, dt * 8);
    const wdt = dt * timeScale;

    if (state === "play") {
      if (rage) {
        rage.t -= dt;
        shake = Math.max(shake, reduceMotion ? 1.5 : 6);
        if (rage.t <= 0) { rage = null; blade = []; addText("RAGE OVER", cx, cy - coreR - 40, "#ffffff", 22, 1); }
      } else {
        dropT += dt;
        if (dropT >= DROP_EVERY) dropT = dropDie() ? 0 : DROP_EVERY;
      }

      elapsed += wdt;
      if (combo > 0) { comboT -= wdt; if (comboT <= 0) combo = 0; }

      spawnT -= wdt;
      if (spawnT <= 0) { spawn(); spawnT = spawnInterval(); }

      const w = 1 + Math.floor(elapsed / 25);
      if (w > wave) {
        wave = w;
        banner = { text: "WAVE " + wave, t: 1.6 };
        for (let i = 0; i < wave + 3; i++) spawn(i % 3 === 0 ? "runner" : null);
        haptic("medium");
      }

      for (const e of enemies) {
        if (e.dead) continue;
        const dx = cx - e.x, dy = cy - e.y, d = Math.hypot(dx, dy) || 1;
        if (e.frozen > 0) e.frozen -= wdt;
        else {
          const sp = e.speed * (e.slow > 0 ? 0.45 : 1) * wdt;
          e.x += (dx / d) * sp; e.y += (dy / d) * sp;
          e.rot += wdt * (e.type === "runner" ? 6 : 1.5);
        }
        e.slow -= wdt;
        e.flash -= dt;
        if (d < coreR + e.r) hitCore(e);
        if (state !== "play") break;
      }

      for (const p of projectiles) {
        const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
        const step = p.speed * wdt;
        let boom = d <= step;
        if (boom) { p.x = p.tx; p.y = p.ty; } else { p.x += (dx / d) * step; p.y += (dy / d) * step; }
        if (!boom) for (const e of enemies) if (!e.dead && Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r) { boom = true; break; }
        const col = EL[p.el];
        for (let k = 0; k < 2 + p.tier; k++) {
          particles.push({ x: p.x + rand(-3, 3), y: p.y + rand(-3, 3), vx: rand(-30, 30), vy: rand(-30, 30),
            life: rand(0.2, 0.45), max: 0.45, c: Math.random() < 0.5 ? col.c : col.c2, size: rand(2, 3 + p.tier), sq: false, g: 0, drag: 0.9 });
        }
        if (boom) { p.done = true; detonate(p); }
      }
      projectiles = projectiles.filter((p) => !p.done);
      enemies = enemies.filter((e) => !e.dead);
    }

    // effects
    for (const p of particles) {
      p.vx *= Math.pow(p.drag, wdt * 60); p.vy *= Math.pow(p.drag, wdt * 60);
      p.vy += p.g * wdt;
      p.x += p.vx * wdt; p.y += p.vy * wdt;
      p.life -= wdt;
    }
    particles = particles.filter((p) => p.life > 0);
    for (const t of texts) { t.y += t.vy * dt; t.life -= dt; }
    texts = texts.filter((t) => t.life > 0);
    for (const r of rings) r.life -= wdt;
    rings = rings.filter((r) => r.life > 0);
    for (const b of bolts) b.life -= dt;
    bolts = bolts.filter((b) => b.life > 0);
    for (const b of blade) b.age += dt;
    blade = blade.filter((b) => b.age < 0.22);
    for (const d of slots) if (d) { d.drop = Math.min(1, d.drop + dt * 4); d.pop = Math.max(0, d.pop - dt * 3); }

    shake = Math.max(0, shake - dt * 30);
    flash = Math.max(0, flash - dt * 1.6);
    coreKick = Math.max(0, coreKick - dt * 3);
    comboPop = Math.max(0, comboPop - dt * 4);
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    shownScore += (score - shownScore) * Math.min(1, dt * 10);
    if (Math.abs(score - shownScore) < 1) shownScore = score;
  }

  // ---- Rage slicing ----------------------------------------------------
  function distToSeg(px, py, ax, ay, bx, by) {
    const vx = bx - ax, vy = by - ay;
    const l = vx * vx + vy * vy || 1;
    const t = clamp(((px - ax) * vx + (py - ay) * vy) / l, 0, 1);
    return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
  }
  function slice(ax, ay, bx, by) {
    let n = 0;
    for (const e of enemies) {
      if (!e.dead && distToSeg(e.x, e.y, ax, ay, bx, by) < e.r + 14) { kill(e, "slice"); n++; }
    }
    if (n) {
      addShake(3 + n);
      if (now - ptr.lastBuzz > 0.06) { haptic("light"); ptr.lastBuzz = now; }
    }
    blade.push({ x: bx, y: by, age: 0 });
  }

  // ---- Render ----------------------------------------------------------
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(bg, 0, 0, W, H);

    const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
    ctx.save();
    ctx.translate(sx, sy);
    drawEnemies();
    drawCore();
    ctx.globalCompositeOperation = "lighter";
    drawRings();
    drawProjectiles();
    drawBolts();
    drawParticles();
    ctx.globalCompositeOperation = "source-over";
    drawTexts();
    ctx.restore();

    drawTray();

    ctx.save();
    ctx.translate(sx * 0.5, sy * 0.5);
    drawHUD();
    ctx.restore();

    if (ptr.dragging && ptr.slot >= 0 && slots[ptr.slot]) {
      drawDie(ptr.x - slotSize / 2, ptr.y - slotSize / 2, slotSize * 1.08, slots[ptr.slot], 0.95);
    }
    if (rage) drawRage();
    if (flash > 0) {
      ctx.globalAlpha = Math.min(0.6, flash);
      ctx.fillStyle = flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    if (state === "title") drawTitle();
    if (state === "over") drawOver();
  }

  function drawEnemies() {
    for (const e of enemies) {
      const col = e.frozen > 0 ? "#bff4ff" : e.c;
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.beginPath();
      if (e.type === "crawler") {
        ctx.rotate(Math.atan2(cy - e.y, cx - e.x));
        const wig = e.frozen > 0 ? 0 : Math.sin(e.rot * 4) * 0.12;
        ctx.moveTo(e.r * 1.1, 0);
        ctx.lineTo(-e.r * 0.8, e.r * (0.8 + wig));
        ctx.lineTo(-e.r * 0.4, 0);
        ctx.lineTo(-e.r * 0.8, -e.r * (0.8 - wig));
      } else if (e.type === "runner") {
        ctx.rotate(e.rot);
        ctx.moveTo(0, -e.r); ctx.lineTo(e.r, 0); ctx.lineTo(0, e.r); ctx.lineTo(-e.r, 0);
      } else {
        ctx.rotate(e.rot * 0.3);
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * Math.PI * 2;
          ctx[k ? "lineTo" : "moveTo"](Math.cos(a) * e.r, Math.sin(a) * e.r);
        }
      }
      ctx.closePath();
      ctx.fillStyle = e.flash > 0 ? "#ffffff" : rgba(col, 0.2);
      ctx.fill();
      ctx.strokeStyle = rgba(col, 0.3); ctx.lineWidth = 7; ctx.stroke();
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
      if (e.frozen > 0) {
        ctx.strokeStyle = "rgba(212,248,255,0.8)"; ctx.lineWidth = 1.5;
        ctx.strokeRect(-e.r - 4, -e.r - 4, e.r * 2 + 8, e.r * 2 + 8);
      }
      ctx.restore();
      if (e.hp < e.maxHp || e.type === "brute") {
        const w = e.r * 2, y = e.y - e.r - 9;
        ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(e.x - w / 2, y, w, 3);
        ctx.fillStyle = col; ctx.fillRect(e.x - w / 2, y, w * clamp(e.hp / e.maxHp, 0, 1), 3);
      }
    }
  }

  function drawCore() {
    if (state === "over") return;
    const R = coreR * (1 + Math.sin(now * 3) * 0.04 + coreKick * 0.18);
    const glow = ctx.createRadialGradient(cx, cy, R * 0.5, cx, cy, R * 3.2);
    glow.addColorStop(0, "rgba(70,120,255,0.45)"); glow.addColorStop(1, "rgba(70,120,255,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, R * 3.2, 0, Math.PI * 2); ctx.fill();

    // outer rotating rings
    ctx.save();
    ctx.translate(cx, cy);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#58e1ff";
    ctx.shadowColor = "#58e1ff"; ctx.shadowBlur = 12;
    ctx.rotate(now * 0.6);
    ctx.beginPath();
    for (let k = 0; k < 6; k++) { const a = (k / 6) * Math.PI * 2; ctx[k ? "lineTo" : "moveTo"](Math.cos(a) * R * 1.35, Math.sin(a) * R * 1.35); }
    ctx.closePath(); ctx.stroke();
    ctx.rotate(-now * 1.4);
    ctx.strokeStyle = hp < 30 && Math.sin(now * 14) > 0 ? "#ffffff" : "#ff4766";
    ctx.shadowColor = "#ff4766";
    ctx.setLineDash([R * 0.5, R * 0.35]);
    ctx.beginPath(); ctx.arc(0, 0, R * 1.62, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    for (let k = 0; k < 3; k++) {
      const a = now * 2 + (k / 3) * Math.PI * 2;
      ctx.fillStyle = "#ffe14d";
      ctx.beginPath(); ctx.arc(Math.cos(a) * R * 1.62, Math.sin(a) * R * 1.62, 2.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // body (Character #1 placeholder)
    ctx.save();
    ctx.shadowColor = "#3d7bff"; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    if (coreImg && coreImg.complete && coreImg.naturalWidth) {
      ctx.fillStyle = "#101a66"; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.clip();
      ctx.drawImage(coreImg, cx - R, cy - R, R * 2, R * 2);
    } else {
      const g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.1, cx, cy, R);
      g.addColorStop(0, "#cfe0ff"); g.addColorStop(0.35, "#4d7dff"); g.addColorStop(1, "#14207a");
      ctx.fillStyle = g; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      font(700, Math.round(R * 0.62)); spacing(0);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("#1", cx, cy + 1);
    }
    ctx.restore();
    ctx.strokeStyle = "#ffe3a3"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  }

  function drawRings() {
    for (const r of rings) {
      const k = 1 - r.life / r.max;
      ctx.globalAlpha = (1 - k) * 0.9;
      ctx.strokeStyle = r.c; ctx.lineWidth = r.w * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.R * ease(k * 1.4), 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawProjectiles() {
    for (const p of projectiles) {
      const col = EL[p.el];
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2.4);
      g.addColorStop(0, "#ffffff"); g.addColorStop(0.3, col.c2); g.addColorStop(0.6, rgba(col.c, 0.6)); g.addColorStop(1, rgba(col.c, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.4, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawBolts() {
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (const b of bolts) {
      const a = b.life / b.max;
      const path = [];
      for (let i = 0; i < b.pts.length - 1; i++) {
        const p = b.pts[i], q = b.pts[i + 1];
        const d = Math.hypot(q.x - p.x, q.y - p.y), n = Math.max(3, (d / 16) | 0);
        const nx = -(q.y - p.y) / (d || 1), ny = (q.x - p.x) / (d || 1);
        for (let k = 0; k <= n; k++) {
          const t = k / n, off = k === 0 || k === n ? 0 : rand(-10, 10);
          path.push(p.x + (q.x - p.x) * t + nx * off, p.y + (q.y - p.y) * t + ny * off);
        }
      }
      for (const [w, c, al] of [[b.w * 5 + 4, "#ffe14d", 0.25], [b.w * 1.5 + 1, "#ffffff", 1]]) {
        ctx.globalAlpha = a * al;
        ctx.strokeStyle = c; ctx.lineWidth = w;
        ctx.beginPath();
        for (let i = 0; i < path.length; i += 2) ctx[i ? "lineTo" : "moveTo"](path[i], path[i + 1]);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.c;
      if (p.sq) ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }

  function drawTexts() {
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; spacing(0);
    for (const t of texts) {
      const k = 1 - t.life / t.max;
      const sc = k < 0.15 ? 0.6 + (k / 0.15) * 0.5 : 1.1 - Math.min(0.1, (k - 0.15));
      ctx.globalAlpha = clamp(t.life / (t.max * 0.5), 0, 1);
      font(700, Math.round(t.size * sc));
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(7,6,15,0.85)";
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = t.c;
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }

  function glyph(el, r, col) {
    ctx.beginPath();
    if (el === "fire") {
      ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(r * 0.95, -r * 0.05, r * 0.55, r * 0.6);
      ctx.quadraticCurveTo(0, r * 1.05, -r * 0.55, r * 0.6);
      ctx.quadraticCurveTo(-r * 0.95, -r * 0.05, 0, -r);
      ctx.fillStyle = col.c; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.2);
      ctx.quadraticCurveTo(r * 0.45, r * 0.3, 0, r * 0.7);
      ctx.quadraticCurveTo(-r * 0.45, r * 0.3, 0, -r * 0.2);
      ctx.fillStyle = col.c2; ctx.fill();
    } else if (el === "ice") {
      ctx.strokeStyle = col.c2; ctx.lineWidth = Math.max(2, r * 0.16); ctx.lineCap = "round";
      for (let k = 0; k < 3; k++) {
        const a = (k / 3) * Math.PI + Math.PI / 2, c = Math.cos(a), s = Math.sin(a);
        ctx.moveTo(-c * r, -s * r); ctx.lineTo(c * r, s * r);
        for (const sgn of [-1, 1]) {
          const bx = c * r * 0.55 * sgn, by = s * r * 0.55 * sgn;
          const a1 = a + 0.7, a2 = a - 0.7, l = r * 0.32 * sgn;
          ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(a1) * l, by + Math.sin(a1) * l);
          ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(a2) * l, by + Math.sin(a2) * l);
        }
      }
      ctx.stroke();
    } else {
      ctx.moveTo(r * 0.3, -r); ctx.lineTo(-r * 0.5, r * 0.12); ctx.lineTo(-r * 0.02, r * 0.12);
      ctx.lineTo(-r * 0.3, r); ctx.lineTo(r * 0.5, -r * 0.12); ctx.lineTo(r * 0.02, -r * 0.12);
      ctx.closePath();
      ctx.fillStyle = col.c; ctx.fill();
    }
  }

  function drawDie(x, y, s, d, alpha) {
    const col = EL[d.el];
    const e = ease(d.drop);
    ctx.save();
    ctx.translate(x + s / 2, y + s / 2 - (1 - e) * s * 0.9);
    const sc = 1 + d.pop * 0.3;
    ctx.scale(sc, sc);
    ctx.globalAlpha = alpha * (0.3 + 0.7 * e);
    ctx.shadowColor = col.c;
    ctx.shadowBlur = 6 + d.tier * 7;
    rr(-s / 2, -s / 2, s, s, s * 0.22);
    ctx.fillStyle = "#140f26"; ctx.fill();
    ctx.shadowBlur = 0;
    const g = ctx.createLinearGradient(0, -s / 2, 0, s / 2);
    g.addColorStop(0, rgba(col.c, 0.38)); g.addColorStop(1, rgba(col.c, 0.06));
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = col.c; ctx.lineWidth = d.tier >= 3 ? 3 : 2; ctx.stroke();
    if (d.tier >= 2) {
      rr(-s / 2 + 4, -s / 2 + 4, s - 8, s - 8, s * 0.16);
      ctx.strokeStyle = rgba(col.c2, 0.5); ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.save();
    ctx.translate(0, -s * 0.06);
    glyph(d.el, s * (0.2 + d.tier * 0.03), col);
    ctx.restore();
    // tier pips
    ctx.fillStyle = col.c2;
    for (let k = 0; k < d.tier; k++) {
      const px = (k - (d.tier - 1) / 2) * s * 0.16;
      ctx.beginPath(); ctx.arc(px, s * 0.33, s * 0.045, 0, Math.PI * 2); ctx.fill();
    }
    if (d.tier >= MAX_TIER) {
      ctx.rotate(now * 1.5);
      ctx.strokeStyle = rgba(col.c2, 0.8); ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 6]);
      ctx.strokeRect(-s * 0.6, -s * 0.6, s * 1.2, s * 1.2);
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  function drawTray() {
    const g = ctx.createLinearGradient(0, trayTop, 0, H);
    g.addColorStop(0, "rgba(14,9,32,0.94)"); g.addColorStop(1, "rgba(6,4,14,0.98)");
    ctx.fillStyle = g; ctx.fillRect(0, trayTop, W, H - trayTop);
    const lg = ctx.createLinearGradient(0, 0, W, 0);
    lg.addColorStop(0, "#ff3df0"); lg.addColorStop(0.5, "#7a5cff"); lg.addColorStop(1, "#3fe0ff");
    ctx.fillStyle = lg; ctx.fillRect(0, trayTop, W, 2);

    const full = slots.indexOf(null) < 0;
    const prog = rage ? 0 : clamp(dropT / DROP_EVERY, 0, 1);
    ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fillRect(16, trayTop + 12, W - 32, 3);
    ctx.fillStyle = full ? "#ff4766" : "#3fe0ff"; ctx.fillRect(16, trayTop + 12, (W - 32) * (full ? 1 : prog), 3);

    font(600, 11); spacing(1.6);
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "left"; ctx.fillStyle = "rgba(220,210,255,0.6)";
    ctx.fillText("MAGIC DICE", 16, trayTop + 27);
    ctx.textAlign = "right";
    ctx.fillStyle = full ? "#ff8a9c" : "rgba(220,210,255,0.6)";
    ctx.fillText(rage ? "PAUSED" : full ? "SLOTS FULL" : "NEXT " + Math.max(0, DROP_EVERY - dropT).toFixed(1) + "s", W - 16, trayTop + 27);
    spacing(0);

    const dragged = ptr.dragging && ptr.slot >= 0 ? slots[ptr.slot] : null;
    for (let i = 0; i < SLOT_COUNT; i++) {
      const r = slotRect(i);
      rr(r.x, r.y, r.s, r.s, r.s * 0.22);
      ctx.fillStyle = "rgba(255,255,255,0.03)"; ctx.fill();
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = "rgba(200,180,255,0.18)"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.setLineDash([]);
      const d = slots[i];
      if (!d) continue;
      if (dragged && ptr.slot === i) { drawDie(r.x, r.y, r.s, d, 0.2); continue; }
      drawDie(r.x, r.y, r.s, d, 1);
      if (dragged && canMerge(dragged, d)) {
        rr(r.x - 4, r.y - 4, r.s + 8, r.s + 8, r.s * 0.26);
        ctx.strokeStyle = `rgba(255,255,255,${0.5 + Math.sin(now * 10) * 0.4})`; ctx.lineWidth = 2; ctx.stroke();
      }
    }
  }

  function drawHUD() {
    const top = 10;
    const hg = ctx.createLinearGradient(0, 0, 0, hudH + 10);
    hg.addColorStop(0, "rgba(7,6,15,0.85)"); hg.addColorStop(1, "rgba(7,6,15,0)");
    ctx.fillStyle = hg; ctx.fillRect(0, 0, W, hudH + 10);

    ctx.textBaseline = "alphabetic";
    font(600, 11); spacing(1.8);
    ctx.fillStyle = "rgba(220,210,255,0.6)";
    ctx.textAlign = "left"; ctx.fillText("SCORE", 16, top + 14);
    ctx.textAlign = "right"; ctx.fillText("BEST", W - 16, top + 14);
    ctx.textAlign = "center"; ctx.fillStyle = "#c9b8ff"; ctx.fillText("WAVE " + wave, cx, top + 14);
    spacing(0);

    ctx.shadowColor = "#3fe0ff"; ctx.shadowBlur = 14;
    font(700, 30); ctx.textAlign = "left"; ctx.fillStyle = "#ffffff";
    ctx.fillText(Math.round(shownScore).toLocaleString("en-US"), 16, top + 44);
    ctx.shadowColor = "#ffe14d";
    font(700, 20); ctx.textAlign = "right"; ctx.fillStyle = "#ffe14d";
    ctx.fillText(Math.max(best, score).toLocaleString("en-US"), W - 16, top + 42);
    ctx.shadowBlur = 0;

    // health
    const bx = 16, by = top + 54, bw = W - 32, bh = 6, ratio = hp / MAX_HP;
    rr(bx, by, bw, bh, 3); ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fill();
    if (ratio > 0) {
      rr(bx, by, Math.max(bh, bw * ratio), bh, 3);
      const c = ratio > 0.5 ? "#3fe0ff" : ratio > 0.25 ? "#ffe14d" : "#ff4766";
      ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0;
    }
    for (let k = 1; k < 10; k++) { ctx.fillStyle = "rgba(7,6,15,0.7)"; ctx.fillRect(bx + (bw * k) / 10, by, 2, bh); }

    // combo
    if (combo >= 2) {
      const sz = 22 * (1 + comboPop * 0.35);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      font(700, Math.round(sz));
      const c = combo >= 20 ? "#ff3df0" : combo >= 10 ? "#ffe14d" : "#3fe0ff";
      ctx.shadowColor = c; ctx.shadowBlur = 16; ctx.fillStyle = c;
      ctx.fillText(combo + " COMBO", cx, hudH + 18);
      ctx.shadowBlur = 0;
      font(600, 12); ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.fillText("x" + (1 + (combo - 1) * 0.1).toFixed(1) + " points", cx, hudH + 38);
      ctx.fillStyle = rgba(c, 0.6);
      const w = 70 * clamp(comboT / COMBO_WINDOW, 0, 1);
      ctx.fillRect(cx - w / 2, hudH + 49, w, 2);
    }

    if (banner && state === "play") {
      const k = banner.t / 1.6;
      ctx.globalAlpha = Math.min(1, k * 3);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      font(700, 34); spacing(4);
      ctx.shadowColor = "#7a5cff"; ctx.shadowBlur = 20; ctx.fillStyle = "#ffffff";
      ctx.fillText(banner.text, cx, cy - coreR - 70 - (1 - k) * 20);
      ctx.shadowBlur = 0; spacing(0);
      ctx.globalAlpha = 1;
    }
  }

  function drawRage() {
    const col = EL[rage.el];
    const pulse = 0.5 + Math.sin(now * 12) * 0.5;
    const vg = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.25, cx, cy, Math.max(W, H) * 0.75);
    vg.addColorStop(0, rgba(col.c, 0)); vg.addColorStop(1, rgba(col.c, 0.28 + pulse * 0.12));
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const y = hudH + 70;
    font(700, Math.round(38 + pulse * 4)); spacing(5);
    ctx.shadowColor = col.c; ctx.shadowBlur = 24;
    ctx.fillStyle = "#ffffff";
    ctx.fillText("RAGE MODE", cx + rand(-1.5, 1.5), y);
    ctx.shadowBlur = 0;
    font(600, 13); spacing(3);
    ctx.fillStyle = col.c2;
    ctx.fillText("SWIPE TO SLICE", cx, y + 30);
    spacing(0);
    const w = Math.min(220, W - 64) * clamp(rage.t / RAGE_TIME, 0, 1);
    ctx.fillStyle = col.c; ctx.fillRect(cx - w / 2, y + 46, w, 4);

    // blade trail
    if (blade.length > 1) {
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.globalCompositeOperation = "lighter";
      for (let i = 1; i < blade.length; i++) {
        const a = blade[i - 1], b = blade[i];
        const k = 1 - b.age / 0.22;
        ctx.strokeStyle = rgba(col.c, 0.5 * k); ctx.lineWidth = 14 * k;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${k})`; ctx.lineWidth = 4 * k;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      ctx.globalCompositeOperation = "source-over";
    }
  }

  function scrim(a) { ctx.fillStyle = `rgba(5,4,12,${a})`; ctx.fillRect(0, 0, W, H); }

  function drawTitle() {
    scrim(0.72);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const big = clamp(W * 0.12, 34, 54);
    let y = Math.max(hudH + 10, cy - 210);
    font(700, Math.round(big)); spacing(2);
    ctx.shadowColor = "#ff3df0"; ctx.shadowBlur = 22; ctx.fillStyle = "#ffffff";
    ctx.fillText("DICE & CHAIN", cx, y);
    ctx.shadowColor = "#3fe0ff"; ctx.fillStyle = "#3fe0ff";
    font(700, Math.round(big * 0.62)); spacing(big * 0.18);
    ctx.fillText("DEFENSE", cx, y + big * 0.82);
    ctx.shadowBlur = 0; spacing(0);

    y += big * 0.82 + 46;
    const ds = 40;
    const rows = ELS.map((k) => [k, EL[k]]);
    const colW = Math.min(110, (W - 32) / 3);
    rows.forEach(([k, v], i) => {
      const x = cx + (i - 1) * colW;
      drawDie(x - ds / 2, y - ds / 2, ds, { el: k, tier: 1, drop: 1, pop: 0 }, 1);
      font(700, 13); spacing(1.5); ctx.fillStyle = v.c; ctx.fillText(v.label, x, y + 36);
      spacing(0); font(500, 12); ctx.fillStyle = "rgba(230,222,255,0.75)"; ctx.fillText(v.note, x, y + 53);
    });

    y += 96;
    const lines = [
      ["TAP", "a die to cast it at the nearest enemy"],
      ["DRAG", "a die onto its twin to merge (tier 3 max)"],
      ["LINE UP 3", "of one element for RAGE MODE"]
    ];
    font(500, 14);
    for (const [a, b] of lines) {
      font(700, 14); const wa = ctx.measureText(a + "  ").width;
      font(500, 14); const wb = ctx.measureText(b).width;
      const x0 = cx - (wa + wb) / 2;
      ctx.textAlign = "left";
      font(700, 14); ctx.fillStyle = "#ffe14d"; ctx.fillText(a, x0, y);
      font(500, 14); ctx.fillStyle = "rgba(230,222,255,0.85)"; ctx.fillText(b, x0 + wa, y);
      y += 26;
    }
    ctx.textAlign = "center";
    ctx.globalAlpha = 0.55 + Math.sin(now * 4) * 0.45;
    font(700, 18); spacing(4); ctx.fillStyle = "#ffffff";
    ctx.fillText("TAP TO START", cx, Math.min(trayTop - 24, y + 34));
    ctx.globalAlpha = 1; spacing(0);
  }

  function drawOver() {
    scrim(Math.min(0.75, stateT * 1.2));
    if (stateT < 0.4) return;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    let y = cy - 110;
    font(700, clamp(W * 0.1, 30, 46)); spacing(4);
    ctx.shadowColor = "#ff4766"; ctx.shadowBlur = 22; ctx.fillStyle = "#ff4766";
    ctx.fillText("CORE DOWN", cx, y);
    ctx.shadowBlur = 0; spacing(2);
    y += 58;
    font(600, 12); ctx.fillStyle = "rgba(220,210,255,0.6)"; ctx.fillText("SCORE", cx, y);
    font(700, 44); ctx.fillStyle = "#ffffff"; spacing(0); ctx.fillText(score.toLocaleString("en-US"), cx, y + 34);
    y += 80;
    if (newBest) {
      font(700, 16); spacing(3); ctx.fillStyle = "#ffe14d";
      ctx.shadowColor = "#ffe14d"; ctx.shadowBlur = 14;
      ctx.fillText("NEW BEST!", cx, y);
      ctx.shadowBlur = 0;
    } else {
      font(600, 14); spacing(1); ctx.fillStyle = "#ffe14d";
      ctx.fillText("BEST " + best.toLocaleString("en-US"), cx, y);
    }
    spacing(0);
    font(500, 14); ctx.fillStyle = "rgba(230,222,255,0.75)";
    ctx.fillText(`Wave ${wave}  ·  ${kills} kills  ·  best combo ${bestCombo}`, cx, y + 28);
    if (stateT > 0.9) {
      ctx.globalAlpha = 0.55 + Math.sin(now * 4) * 0.45;
      font(700, 18); spacing(4); ctx.fillStyle = "#ffffff";
      ctx.fillText("TAP TO PLAY AGAIN", cx, y + 82);
      ctx.globalAlpha = 1; spacing(0);
    }
  }

  // ---- Input -----------------------------------------------------------
  function pos(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  canvas.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    canvas.focus({ preventScroll: true });
    if (ptr.down) return;
    const p = pos(ev);
    if (state === "title") { startGame(); return; }
    if (state === "over") { if (stateT > 0.9) startGame(); return; }
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    Object.assign(ptr, { down: true, id: ev.pointerId, x: p.x, y: p.y, sx: p.x, sy: p.y, lx: p.x, ly: p.y, slot: -1, dragging: false });
    if (rage) { blade = [{ x: p.x, y: p.y, age: 0 }]; return; }
    const i = hitSlot(p.x, p.y, 4);
    if (i >= 0 && slots[i]) ptr.slot = i;
  });
  canvas.addEventListener("pointermove", (ev) => {
    if (!ptr.down || ev.pointerId !== ptr.id) return;
    const p = pos(ev);
    ptr.x = p.x; ptr.y = p.y;
    if (rage) { slice(ptr.lx, ptr.ly, p.x, p.y); }
    else if (ptr.slot >= 0 && !ptr.dragging && Math.hypot(p.x - ptr.sx, p.y - ptr.sy) > 10) ptr.dragging = true;
    ptr.lx = p.x; ptr.ly = p.y;
  });
  function release(ev, cancelled) {
    if (!ptr.down || ev.pointerId !== ptr.id) return;
    ptr.down = false;
    const from = ptr.slot;
    if (from >= 0 && slots[from] && !rage && !cancelled) {
      if (!ptr.dragging) useSlot(from);
      else {
        const to = hitSlot(ptr.x, ptr.y, slotGap / 2);
        if (to >= 0 && to !== from) moveDie(from, to);
        else if (to < 0 && ptr.y < trayTop - 8) useSlot(from, ptr.x, ptr.y); // drag into the field to aim
      }
    }
    ptr.slot = -1; ptr.dragging = false;
  }
  canvas.addEventListener("pointerup", (ev) => release(ev, false));
  canvas.addEventListener("pointercancel", (ev) => release(ev, true));
  canvas.addEventListener("contextmenu", (ev) => ev.preventDefault());

  // Keyboard: 1-5 cast a die, Space/Enter starts.
  canvas.addEventListener("keydown", (ev) => {
    if (state !== "play") { if ((ev.key === " " || ev.key === "Enter") && (state === "title" || stateT > 0.9)) startGame(); return; }
    const n = parseInt(ev.key, 10);
    if (n >= 1 && n <= SLOT_COUNT && !rage) useSlot(n - 1);
  });

  // ---- Boot ------------------------------------------------------------
  if (tg) {
    try {
      tg.ready(); tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      if (tg.setHeaderColor) tg.setHeaderColor("#07060f");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#07060f");
    } catch (e) {}
  }

  layout();
  reset();
  if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
  else window.addEventListener("resize", layout);

  let last = performance.now();
  function loop(t) {
    const dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
    last = t;
    now = t / 1000;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
