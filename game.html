<title>Dice &amp; Chain Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&family=Vazirmatn:wght@600;700;800&display=swap">
<style>
/* Layout: full-height stage. Canvas = arena + dice tray; DOM = HUD and menus layered on top. Cartoon night-sky look taken from the Volya poster. */
:root {
  --ink: #070b2a;
  --panel-top: #2b3a96;
  --panel-bot: #18215e;
  --text: #f5f7ff;
  --muted: #b3bdf0;
  --gold: #ffcf3d;
  --gold-hi: #ffe98a;
  --gold-deep: #b86400;
  --blue: #4d74ff;
  --blue-deep: #22348f;
  --red: #ff4a3d;
  --red-deep: #9e1426;
  --green: #5fe07a;
  --font: "Baloo 2", "Vazirmatn", "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
.stage { position: relative; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; }
#game { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 3px; }

/* ---------- HUD ---------- */
.hud {
  position: absolute; inset: 0 0 auto 0; z-index: 5;
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px 0;
  pointer-events: none;
}
.hud-side { display: flex; flex-direction: column; gap: 6px; width: 132px; flex: none; }
.hp {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 10px 5px 6px;
  border-radius: 999px;
  background: rgba(8, 12, 44, 0.7);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1);
}
.hp svg { width: 22px; height: 22px; flex: none; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
.hp-bar { flex: 1; height: 12px; border-radius: 999px; background: rgba(0,0,0,0.45); overflow: hidden; }
.hp-bar i {
  display: block; height: 100%; width: 100%; border-radius: 999px;
  background: linear-gradient(#9dffb0, var(--green) 55%, #2fae4c);
  transition: width .25s ease, background .3s;
}
.hp.low .hp-bar i { background: linear-gradient(#ffb0a6, var(--red) 55%, #c21d2b); }
.hp.low svg { animation: beat .5s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.2); } }
.wave-chip {
  align-self: flex-start;
  padding: 1px 12px 0;
  border-radius: 999px;
  background: rgba(8, 12, 44, 0.7);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1);
  font-weight: 800; font-size: 14px; color: var(--muted);
}
.score-box { flex: 1; min-width: 0; text-align: center; line-height: 1; }
.score {
  font-weight: 800; font-size: 34px;
  color: #fff;
  text-shadow: 0 3px 0 #1a2270, 0 0 18px rgba(90,140,255,.6);
  font-variant-numeric: tabular-nums;
  transition: transform .1s;
}
.score.bump { transform: scale(1.12); }
.best {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 2px;
  font-weight: 800; font-size: 15px; color: var(--gold);
  text-shadow: 0 2px 0 rgba(0,0,0,.4);
}
.best svg { width: 16px; height: 16px; }
.hud-end { width: 132px; display: flex; justify-content: flex-end; flex: none; }
.iconbtn {
  pointer-events: auto;
  width: 48px; height: 48px; border-radius: 50%; border: 0; padding: 0;
  display: grid; place-items: center;
  background: linear-gradient(#7193ff, var(--blue) 60%, #3b58d6);
  color: #fff;
  box-shadow: 0 5px 0 var(--blue-deep), 0 8px 16px rgba(0,0,0,.35);
  cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.iconbtn svg { width: 24px; height: 24px; }
.iconbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--blue-deep), 0 4px 8px rgba(0,0,0,.35); }

/* ---------- Screens ---------- */
.screen {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center;
  padding-inline: 16px; padding-block: 16px 24px;
  overflow-y: auto;
  background: radial-gradient(110% 70% at 50% 25%, rgba(40,70,190,.55), rgba(5,8,30,.92) 70%);
  touch-action: pan-y;
  animation: fadein .25s ease-out;
}
.screen.center > .card { margin-block: auto; }
@keyframes fadein { from { opacity: 0; } }
.screen > * { flex: none; }
.corner { position: absolute; top: 12px; inset-inline-end: 12px; }

.title-wrap { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; gap: 12px; margin-block: auto; padding-top: 20px; }
.portrait {
  width: 132px; height: 132px; border-radius: 50%;
  padding: 5px;
  background: linear-gradient(var(--gold-hi), #e09a14);
  box-shadow: inset 0 -6px 8px rgba(120,60,0,.6), 0 0 0 5px #c81e2a, 0 8px 0 5px #6a0a16, 0 0 40px rgba(80,140,255,.8), 0 22px 26px rgba(0,0,0,.5);
  animation: float 3s ease-in-out infinite;
}
.portrait { position: relative; }
.portrait img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background: #13206b; }
.portrait::after {
  content: ""; position: absolute; inset: 5px; border-radius: 50%; pointer-events: none;
  background:
    radial-gradient(ellipse 34% 20% at 34% 22%, rgba(255,255,255,.7), rgba(255,255,255,0) 100%),
    radial-gradient(circle at 36% 30%, rgba(255,255,255,.12) 0, rgba(0,0,0,0) 50%, rgba(0,0,45,.55) 100%);
}
@keyframes float { 50% { transform: translateY(-8px); } }
.logo {
  margin: 6px 0 0;
  font-family: "Baloo 2", system-ui, sans-serif;
  font-weight: 800; font-size: clamp(56px, 18vw, 80px); line-height: .9;
  letter-spacing: .04em;
  background: linear-gradient(#ffb36b, #ff4a2a 45%, #c4101c);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #4a0710) drop-shadow(0 0 22px rgba(255,90,40,.55));
}
.subtitle { margin: 0; font-weight: 800; font-size: 18px; color: #9fdcff; text-align: center; text-wrap: balance; }
.tagline { margin: 0 0 6px; font-weight: 700; font-size: 16px; color: var(--muted); text-align: center; text-wrap: balance; }

.btn {
  appearance: none; border: 0; cursor: pointer;
  width: 100%;
  min-height: 54px;
  padding: 10px 22px 8px;
  border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font-weight: 800; font-size: 21px; line-height: 1.1;
  transition: transform .08s, box-shadow .08s;
}
.btn svg { width: 24px; height: 24px; flex: none; }
.btn.primary {
  background: linear-gradient(var(--gold-hi), var(--gold) 50%, #ff9d00);
  color: #4a2300;
  box-shadow: 0 6px 0 var(--gold-deep), 0 12px 24px rgba(0,0,0,.35);
}
.btn.primary:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--gold-deep), 0 4px 10px rgba(0,0,0,.35); }
.btn.secondary {
  background: linear-gradient(#7193ff, var(--blue) 60%, #3b58d6);
  color: #fff;
  box-shadow: 0 6px 0 var(--blue-deep), 0 12px 24px rgba(0,0,0,.3);
}
.btn.secondary:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--blue-deep); }
.btn.share {
  background: linear-gradient(#8ff0a4, #3fcf6a 55%, #22a64c);
  color: #0d3a1c;
  box-shadow: 0 6px 0 #17773a, 0 12px 24px rgba(0,0,0,.3);
}
.btn.share:active { transform: translateY(5px); box-shadow: 0 1px 0 #17773a; }
.toast {
  position: absolute; left: 50%; bottom: 24px; z-index: 30;
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  padding: 10px 18px 8px; border-radius: 999px;
  background: #ffffff; color: #1d2470;
  font-weight: 800; font-size: 16px; text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
  animation: fadein .2s ease-out;
}
.btn.ghost { background: rgba(255,255,255,.08); color: var(--text); box-shadow: inset 0 0 0 2px rgba(255,255,255,.16); min-height: 48px; font-size: 18px; }
.btn.ghost:active { transform: scale(.97); }
.btn.big { min-height: 66px; font-size: 28px; }
.btn.big svg { width: 30px; height: 30px; }

.card {
  width: 100%; max-width: 400px;
  padding: 18px;
  border-radius: 28px;
  background: linear-gradient(rgba(43,58,150,.96), rgba(24,33,94,.96));
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 20px 40px rgba(0,0,0,.45);
  display: flex; flex-direction: column; gap: 12px;
}
.card h2 { margin: 0; font-weight: 800; font-size: 26px; text-align: center; line-height: 1.1; text-wrap: balance; }
.card h3 { margin: 4px 0 0; font-weight: 800; font-size: 15px; color: var(--muted); letter-spacing: .04em; }

.elements { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.el-card {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 10px 4px 8px; border-radius: 18px;
  background: rgba(0,0,0,.2);
  text-align: center; min-width: 0;
}
.el-card img { width: 52px; height: 52px; }
.el-card b { font-size: 17px; font-weight: 800; line-height: 1.2; }
.el-card small { font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.el-card.fire b { color: #ff8a5c; }
.el-card.ice b { color: #7fe3ff; }
.el-card.bolt b { color: #ffd84d; }
.el-card.poison b { color: #8ff06a; }
.el-card.heal b { color: #ff8fc8; }
.el-card.nova b { color: #d9a8ff; }
.tips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tips li {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px; border-radius: 16px; background: rgba(0,0,0,.2);
  font-weight: 700; font-size: 15px; line-height: 1.3;
}
.tips li > span:last-child { min-width: 0; }
.tip-ico { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.08); }
.tip-ico svg { width: 26px; height: 26px; }

.big-score { text-align: center; line-height: 1; }
.big-score small { display: block; font-weight: 800; font-size: 15px; color: var(--muted); }
.big-score b { display: block; font-weight: 800; font-size: 56px; color: #fff; text-shadow: 0 4px 0 #1a2270; margin-top: 4px; }
.badge {
  align-self: center;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 14px 2px; border-radius: 999px;
  background: rgba(255,207,61,.16); color: var(--gold);
  font-weight: 800; font-size: 17px;
}
.badge svg { width: 18px; height: 18px; }
.badge.new { background: linear-gradient(var(--gold-hi), var(--gold)); color: #4a2300; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats div { padding: 8px 4px; border-radius: 16px; background: rgba(0,0,0,.22); text-align: center; min-width: 0; }
.stats small { display: block; font-weight: 700; font-size: 12px; color: var(--muted); line-height: 1.2; }
.stats b { display: block; font-weight: 800; font-size: 22px; line-height: 1.2; }
.over-title { color: #ff8a7a; }

.langs {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
  max-height: 38vh; overflow-y: auto; padding: 2px;
  touch-action: pan-y;
}
.lang {
  appearance: none; border: 2px solid transparent; cursor: pointer;
  min-height: 46px; padding: 6px 12px; border-radius: 16px;
  background: rgba(0,0,0,.22); color: var(--text);
  font-weight: 700; font-size: 16px; text-align: start; line-height: 1.2;
  display: flex; flex-direction: column; justify-content: center;
  min-width: 0; overflow-wrap: anywhere;
}
.lang.auto { grid-column: 1 / -1; }
.lang small { font-size: 13px; color: var(--muted); font-weight: 700; }
.lang[aria-pressed="true"] { border-color: var(--gold); background: rgba(255,207,61,.14); }
.toggle-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 8px; padding-inline: 14px 8px; border-radius: 16px; background: rgba(0,0,0,.22);
  font-weight: 800; font-size: 18px;
}
.switch {
  appearance: none; border: 0; cursor: pointer; flex: none;
  width: 60px; height: 34px; border-radius: 999px; padding: 3px;
  background: rgba(255,255,255,.18);
  display: flex; transition: background .2s;
}
.switch i { width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.3); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--green); }
.switch[aria-checked="true"] i { transform: translateX(26px); }
[dir="rtl"] .switch[aria-checked="true"] i { transform: translateX(-26px); }

.lvl-tag { font-size: 16px; padding: 3px 10px 1px; border-radius: 999px; background: rgba(74,35,0,.16); }
.hud.levels .best { display: none; }
.goals {
  position: absolute; top: 68px; left: 50%; z-index: 5; transform: translateX(-50%);
  display: flex; gap: 6px; pointer-events: none;
}
.goal {
  display: flex; align-items: center; gap: 4px;
  padding: 2px 10px 0 3px; border-radius: 999px;
  background: rgba(8,12,44,.78); box-shadow: inset 0 0 0 2px rgba(255,255,255,.14);
  font-weight: 800; font-size: 16px; color: #fff; font-variant-numeric: tabular-nums;
}
.goal img { width: 26px; height: 26px; }
.goal.done { box-shadow: inset 0 0 0 2px var(--green); }
.goal.done b { color: var(--green); }
.map-wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }
.map-title { margin: 0; text-align: center; font-weight: 800; font-size: 30px; }
.map-list { display: flex; flex-direction: column; gap: 14px; }
.world { border-radius: 22px; padding: 12px 12px 18px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.16), 0 6px 0 rgba(0,0,0,.35); }
.world h3 { margin: 0 0 10px; font-weight: 800; font-size: 18px; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.lvls { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px 6px; }
.lvl {
  appearance: none; border: 0; cursor: pointer; padding: 0; position: relative;
  aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(#ffe98a, #ffbf1f 60%, #e08a00); color: #4a2300;
  font-weight: 800; font-size: 17px; font-family: inherit;
  box-shadow: 0 4px 0 #9a5a00;
}
.lvl i { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); display: flex; }
.lvl i svg { width: 12px; height: 12px; }
.lvl.boss { background: linear-gradient(#ffb3a8, #ff4a3d 60%, #a8162a); color: #fff; box-shadow: 0 4px 0 #6a0a14; }
.lvl.locked { background: rgba(0,0,0,.35); color: rgba(255,255,255,.55); box-shadow: none; cursor: default; }
.lvl.locked svg { width: 16px; height: 16px; }
.lvl.current { box-shadow: 0 4px 0 #9a5a00, 0 0 0 3px #fff; animation: pulse 1s ease-in-out infinite; }
.intro-world { margin: 0; text-align: center; font-weight: 800; font-size: 16px; }
.intro-goals { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.intro-goal { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 16px 6px; border-radius: 18px; background: rgba(0,0,0,.25); font-weight: 800; font-size: 22px; }
.intro-goal img { width: 46px; height: 46px; }
.unlock {
  display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 18px;
  background: linear-gradient(rgba(255,207,61,.24), rgba(255,207,61,.06));
  box-shadow: inset 0 0 0 2px rgba(255,207,61,.5);
  animation: glowpulse 1.6s ease-in-out infinite;
}
@keyframes glowpulse { 50% { box-shadow: inset 0 0 0 2px rgba(255,207,61,1), 0 0 18px rgba(255,207,61,.35); } }
.unlock img { width: 58px; height: 58px; flex: none; }
.unlock > div { min-width: 0; }
.unlock b { display: block; color: var(--gold); font-size: 18px; font-weight: 800; }
.unlock span { display: block; font-weight: 800; font-size: 16px; }
.unlock small { display: block; color: var(--muted); font-weight: 700; font-size: 14px; line-height: 1.3; }
.win-title { color: var(--gold); }
.win-stars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; }
.win-stars svg { width: 62px; height: 62px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); animation: starpop .5s cubic-bezier(.3,1.6,.5,1) both; }
.win-stars svg:nth-child(2) { width: 78px; height: 78px; animation-delay: .25s; }
.win-stars svg:nth-child(3) { animation-delay: .5s; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } }
.btn-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; }
.btn-row .btn { font-size: 17px; padding-inline: 10px; gap: 8px; }
.btn-row .btn svg { width: 20px; height: 20px; }
.improve { text-align: center; color: var(--green); font-weight: 800; font-size: 17px; margin-top: -4px; }
.rec-hero {
  text-align: center; line-height: 1; padding: 12px 10px 10px; border-radius: 20px;
  background: linear-gradient(rgba(255,207,61,.2), rgba(255,207,61,.06));
  box-shadow: inset 0 0 0 2px rgba(255,207,61,.35);
}
.rec-hero small { display: block; color: var(--muted); font-weight: 800; font-size: 15px; }
.rec-hero b { display: block; margin-top: 4px; font-size: 48px; font-weight: 800; color: var(--gold); text-shadow: 0 3px 0 #7a4a00; font-variant-numeric: tabular-nums; }
.stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#recBody { display: flex; flex-direction: column; gap: 8px; }
#recBody[hidden] { display: none !important; }
.chart { display: block; width: 100%; height: auto; border-radius: 14px; background: rgba(0,0,0,.22); }
.rec-list { display: flex; flex-direction: column; gap: 6px; max-height: 22vh; overflow-y: auto; touch-action: pan-y; }
.rec-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 6px 12px; border-radius: 14px; background: rgba(0,0,0,.22);
  font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums;
}
.rec-row small { color: var(--muted); font-weight: 700; font-size: 13px; margin-inline-end: 8px; }
.rec-row .up { color: var(--green); font-size: 14px; }
.rank-line {
  display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 12px; border-radius: 16px; background: rgba(0,0,0,.22);
  font-weight: 800; font-size: 16px; text-align: center;
}
.rank-line b { color: var(--gold); font-size: 22px; }
.rank-line small { color: var(--muted); font-weight: 700; font-size: 14px; }
.lb-title { display: flex; align-items: center; justify-content: center; gap: 8px; }
.lb-title svg { width: 26px; height: 26px; color: var(--gold); filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
.lb-sub { margin: -6px 0 0; text-align: center; color: var(--muted); font-weight: 700; font-size: 14px; }
.lb-list {
  display: flex; flex-direction: column; gap: 6px;
  max-height: 46vh; overflow-y: auto; padding: 2px;
  touch-action: pan-y;
}
.lb-row {
  display: grid; grid-template-columns: 34px 34px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 16px; background: rgba(0,0,0,.22);
}
.lb-row.me { background: rgba(255,207,61,.16); box-shadow: inset 0 0 0 2px var(--gold); }
.medal {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 800; font-size: 14px; line-height: 1;
  background: rgba(255,255,255,.1); color: var(--text);
  font-variant-numeric: tabular-nums;
}
.medal.m1 { background: linear-gradient(#fff2a8, #f2b62e 60%, #c98410); color: #5a3300; box-shadow: 0 3px 0 #8f5300, inset 0 2px 0 rgba(255,255,255,.6); }
.medal.m2 { background: linear-gradient(#ffffff, #c9d3e3 60%, #8d9bb3); color: #2c3650; box-shadow: 0 3px 0 #5d6a82, inset 0 2px 0 rgba(255,255,255,.7); }
.medal.m3 { background: linear-gradient(#ffd2a8, #d98a4a 60%, #9a5520); color: #3d1c05; box-shadow: 0 3px 0 #6a3410, inset 0 2px 0 rgba(255,255,255,.5); }
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 800; font-size: 16px; color: #fff;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.35);
  text-shadow: 0 1px 0 rgba(0,0,0,.3);
}
.lb-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; font-size: 16px; }

    const Wd = 300, Ht = 96, pad = 14, n = recs.length;
    if (!n) return "";
    const lo = Math.min(...recs.map((r) => r.prev || 0), recs[0].s) * 0.9, hi = Math.max(...recs.map((r) => r.s));
    const X = (i) => (n === 1 ? Wd / 2 : pad + (i / (n - 1)) * (Wd - pad * 2));
    const Y = (v) => Ht - pad - ((v - lo) / Math.max(1, hi - lo)) * (Ht - pad * 2);
    let line = `M${X(0).toFixed(1)} ${Y(recs[0].s).toFixed(1)}`;
    for (let i = 1; i < n; i++) line += ` H${X(i).toFixed(1)} V${Y(recs[i].s).toFixed(1)}`;
    const area = `${line} V${Ht - 4} H${X(0).toFixed(1)} Z`;
    const dots = recs.map((r, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(r.s).toFixed(1)}" r="${i === n - 1 ? 6 : 3.5}" fill="#ffcf3d" stroke="#7a4a00" stroke-width="1.5"/>`).join("");
    return `<svg class="chart" viewBox="0 0 ${Wd} ${Ht}" aria-hidden="true"><defs><linearGradient id="recFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf3d" stop-opacity=".45"/><stop offset="1" stop-color="#ffcf3d" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#recFill)"/><path d="${line}" fill="none" stroke="#ffcf3d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;

  function update(dt) {
    stateT += dt;

    const tsTarget = rage ? RAGE_SLOWMO : 1;
    timeScale += (tsTarget - timeScale) * Math.min(1, dt * 8);
    const wdt = dt * timeScale;

    if (state === "play") {
      if (rage) {
        rage.t -= dt;
        shake = Math.max(shake, reduceMotion ? 1.5 : 5);
        if (rage.t <= 0) { rage = null; blade = []; }
      }
      guard = Math.max(0, guard - dt);
      for (const z of zones) {
        z.t -= wdt; z.spin += wdt * 0.6;
        for (const e of enemies) {
          if (e.dead || Math.hypot(e.x - z.x, e.y - z.y) > z.R + e.r) continue;
          e.poison = 0.3;
          damage(e, z.dps * wdt, null, null, 0, true);
        }
        if (Math.random() < wdt * 14) {
          const a = rand(0, TAU), rr = rand(0, z.R * 0.8);
          emit("goo", z.x + Math.cos(a) * rr, z.y + Math.sin(a) * rr, { n: 1, spd: [0, 10], life: [0.6, 1], size: [2.5, 5], colors: ["#9dff6a", "#d6ff9e"], vy: -40 });
        }
      }
      zones = zones.filter((z) => z.t > 0);
      castCD -= dt;
      if (castCD <= 0 && castQueue.length) {
        const q = castQueue[0];
        if (q.el === "heal" || enemies.some(onScreen)) { castQueue.shift(); autoCast(q.el, q.tier); castCD = 0.13; }
        else if ((q.wait = (q.wait || 0) + dt) > 5) castQueue.shift();
      }
      danger = 0;
      for (const e of enemies) if (onScreen(e)) danger = Math.max(danger, 1 - eta(e) / 1.8);
      if (danger > 0.45 && now - lastWarn > 1.6) { lastWarn = now; haptic("warning"); sfx("warn"); }
      elapsed += wdt;
      playTime += dt;
      if (!LV && !runRecordShown && runBestStart > 0 && score > runBestStart) {
        runRecordShown = true;
        banner = { text: tr("newBest"), t: 1.8 };
        emit("star", cx, hudH, { n: 18, spd: [120, 320], life: [0.8, 1.2], size: [6, 10], colors: ["#ffd84d"], g: 300, vy: -60, vr: 8 });
        sfx("merge"); haptic("success");
      }
      if (combo > 0) { comboT -= wdt; if (comboT <= 0) combo = 0; }
      spawnT -= wdt;
      if (spawnT <= 0) { spawn(); spawnT = spawnInterval(); }
      if (bossT > 0) {
        bossT -= wdt;
        if (bossT <= 0) { spawnAt("boss", cx, -70); banner = { text: "BOSS!", t: 2 }; addShake(10); sfx("rage"); haptic("heavy"); }
      }
      const w = 1 + Math.floor(elapsed / 25);
      if (w > wave) {
        wave = w;
        if (!LV) {
          banner = { text: tr("wave", wave), t: 1.8 };
          const ti = Math.floor((wave - 1) / 4) % THEMES.length;
          if (THEMES[ti] !== TH) { setTheme(ti); doFlash("#ffffff", 0.5); }
          if (wave % 5 === 0) { spawnAt("boss", cx, -70); banner = { text: "BOSS!", t: 2 }; }
        }
        const swarm = LV ? 2 + Math.floor(levelN / 5) : wave + 3;
        for (let i = 0; i < swarm; i++) spawn(i % 3 === 0 && (!LV || levelN >= 7) ? "runner" : null);
        sfx("wave");
        haptic("medium");
      }

      for (const e of enemies) {
        if (e.dead) continue;
        const dx = cx - e.x, dy = cy - e.y, d = Math.hypot(dx, dy) || 1;
        if (e.frozen > 0) e.frozen -= wdt;
        else {
          const sp = e.speed * (e.slow > 0 ? 0.45 : 1) * wdt;
          e.x += (dx / d) * sp; e.y += (dy / d) * sp;
          e.phase += wdt * (e.type === "runner" ? 14 : e.type === "brute" ? 5 : 8);
          if (e.slow > 0 && Math.random() < wdt * 4) emit("flake", e.x, e.y - e.r, { n: 1, spd: [5, 20], life: [0.6, 1], size: [4, 6], colors: ["#ffffff"], vy: 20, vr: 3 });
        }
        e.x += e.kx * wdt; e.y += e.ky * wdt;
        const kd = Math.pow(0.02, wdt); e.kx *= kd; e.ky *= kd;
        e.slow -= wdt;
        if (e.type === "ghost") e.ghostT += wdt;
        if (e.hitCD) e.hitCD = Math.max(0, e.hitCD - wdt);
        if (e.boss) {
          e.summonT = (e.summonT == null ? 6 : e.summonT) - wdt;
          if (e.summonT <= 0) { e.summonT = 6; for (let k = 0; k < 2; k++) spawnAt("crawler", e.x + rand(-40, 40), e.y + rand(10, 40), 0.8); }
        }
        if (e.poison) e.poison = Math.max(0, e.poison - wdt);
        e.flash -= dt;
        e.hit = Math.max(0, e.hit - dt * 5);
        if (d < coreR + e.r * 0.7) hitCore(e);
        if (state !== "play") break;
      }

      for (const p of projectiles) {
        const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy), step = p.speed * wdt;
        let boom = d <= step;
        if (boom) { p.x = p.tx; p.y = p.ty; } else { p.x += (dx / d) * step; p.y += (dy / d) * step; }
        if (!boom) for (const e of enemies) if (!e.dead && Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r) { boom = true; break; }
        p.spin += wdt * 12;
        if (p.el === "fire") {
          emit("glow", p.x, p.y, { n: 2 + p.tier, spd: [10, 50], life: [0.2, 0.4], size: [p.r * 0.8, p.r * 1.4], colors: ["#ff5a1f", "#ff9a2f", "#ffd84d"], grow: -1.6, vy: -30, jit: 3 });
          if (Math.random() < 0.5) emit("spark", p.x, p.y, { n: 1, spd: [40, 120], life: [0.2, 0.35], size: [1.5, 2.5], colors: ["#ffd84d"] });

  // ---- Rage slicing ----------------------------------------------------
  function distToSeg(px, py, ax, ay, bx, by) {

  // ---- HUD (DOM) -------------------------------------------------------

  function drawBoardInner() {

    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const x = boardX + c * cell, y = boardY + r * cell;
      rrPath(ctx, x + 2, y + 2, cell - 4, cell - 4, cell * 0.24);
      ctx.fillStyle = (r + c) % 2 ? "rgba(8,12,48,0.5)" : "rgba(8,12,48,0.32)"; ctx.fill();
    }

    rrPath(ctx, boardX - 4, boardY - 4, cell * COLS + 8, cell * ROWS + 8, 18); ctx.clip();
    const hint = hintMove && boardState === "idle" && !rage ? hintMove : null;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const g = grid[r] && grid[r][c]; if (!g) continue;

      if (g.sp === "rainbow") ctx.rotate(now * 1.5);

      }

  let coreImg = null;

    ctx.beginPath();

    ctx.lineWidth = 2.5; ctx.strokeStyle = TH.star; ctx.stroke();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.5 + Math.sin(now * 3) * 0.15;

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    for (const t of texts) {
      const k = 1 - t.life / t.max;
      const sc = k < 0.12 ? 0.5 + (k / 0.12) * 0.7 : k < 0.25 ? 1.2 - ((k - 0.12) / 0.13) * 0.2 : 1;
      ctx.globalAlpha = clamp(t.life / (t.max * 0.4), 0, 1);
      chunkyText(t.text, t.x, t.y, t.size * sc, t.c);
    }
    ctx.globalAlpha = 1;
  }

  function drawDie(x, y, s, d, alpha) {
    const spr = DICE[d.el + d.tier];
    if (!spr) return;
    const e = ease(d.drop), sc = (s / slotSize) * (1 + d.pop * 0.3);
    const cxd = x + s / 2, cyd = y + s / 2 - (1 - e) * s * 0.9;
    ctx.save();
    const baseA = alpha * (0.3 + 0.7 * e);
    if (d.tier >= 2) {
      ctx.globalCompositeOperation = "lighter";
      const gs = s * (0.95 + d.tier * 0.18) * (1 + Math.sin(now * 4) * 0.06);
      ctx.globalAlpha = baseA * 0.55;
      ctx.drawImage(glow(EL[d.el].c), cxd - gs, cyd - gs, gs * 2, gs * 2);
      ctx.globalCompositeOperation = "source-over";
    }
    ctx.globalAlpha = baseA;
    ctx.translate(cxd, cyd);
    ctx.scale(sc, sc);
    const full = slotSize + spr.pad * 2;
    ctx.drawImage(spr.img, -slotSize / 2 - spr.pad, -slotSize / 2 - spr.pad, full, full);
    ctx.restore();
    if (d.tier >= MAX_TIER) {
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = alpha;
      for (let k = 0; k < 3; k++) {
        const an = now * 2.2 + (k / 3) * TAU, rr = s * 0.62;
        ctx.drawImage(glow("#fff3a0"), cxd + Math.cos(an) * rr - 7, cyd + Math.sin(an) * rr - 7, 14, 14);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }
  }

  function specRect(i) {
    const s = slotSize, gap = 10, w = s * 2 + gap;
    const x0 = rtl ? 22 : W - 22 - w;
    const j = rtl ? 1 - i : i;
    return { x: x0 + j * (s + gap), y: trayTop + (trayH - s) / 2, s };
  }
  function meterRect() {
    const w = slotSize * 2 + 10;
    const x = rtl ? 22 + w + 16 : 24;
    return { x, y: trayTop + trayH / 2 - 12, w: W - 48 - w - 16, h: 24 };
  }
  function drawLock(x, y, s) {
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = s * 0.22;
    ctx.beginPath(); ctx.arc(0, -s * 0.25, s * 0.45, Math.PI, 0); ctx.stroke();
    rrPath(ctx, -s * 0.7, -s * 0.25, s * 1.4, s * 1.1, s * 0.25); ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.fill();
    ctx.restore();
  }
  function drawPowerBar() {
    chunky(10, trayTop, W - 20, trayH, 20, TH.bar[0], TH.bar[1], TH.bar[2]);
    const m = meterRect();
    rrPath(ctx, m.x, m.y, m.w, m.h, m.h / 2); ctx.fillStyle = "rgba(10,6,40,0.6)"; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 2; ctx.stroke();
    const f = rage ? clamp(rage.t / RAGE_TIME, 0, 1) : rageMeter / RAGE_MAX;
    if (f > 0) {
      const fw = Math.max(m.h, m.w * f), fx = rtl ? m.x + m.w - fw : m.x;
      const g = ctx.createLinearGradient(0, m.y, 0, m.y + m.h);
      g.addColorStop(0, "#ffd27a"); g.addColorStop(0.5, rage ? EL[rage.el].c : "#ff5a2f"); g.addColorStop(1, "#a8162a");
      rrPath(ctx, fx, m.y, fw, m.h, m.h / 2); ctx.fillStyle = g; ctx.fill();
      rrPath(ctx, fx + 4, m.y + 3, fw - 8, m.h * 0.3, m.h * 0.15); ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fill();
      if (f > 0.8 || rage) {
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.4 + Math.sin(now * 10) * 0.3;
        ctx.drawImage(glow("#ff7a3d"), fx - 10, m.y - 16, fw + 20, m.h + 32);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
      }
    }
    ctx.save();
    ctx.translate(rtl ? m.x + m.w - 4 : m.x + 4, m.y + m.h / 2);
    ctx.beginPath(); ctx.arc(0, 0, m.h * 0.62, 0, TAU);
    ctx.fillStyle = "#2a1f78"; ctx.fill(); ctx.strokeStyle = "#ffcf3d"; ctx.lineWidth = 2; ctx.stroke();
    paintIcon(ctx, "fire", m.h * 0.34, EL.fire);
    ctx.restore();
    font(800, 12);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fillText(tr("rage"), m.x + m.w / 2, m.y + m.h / 2 + 1);
    for (let i = 0; i < SPECIALS.length; i++) {
      const k = SPECIALS[i], r = specRect(i), n = powers[k];
      rrPath(ctx, r.x, r.y, r.s, r.s, r.s * 0.3);
      ctx.fillStyle = "rgba(10,6,40,0.55)"; ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 3; ctx.stroke();
      if (!unlocked(k)) { drawLock(r.x + r.s / 2, r.y + r.s / 2, r.s * 0.32); continue; }
      drawDie(r.x, r.y, r.s, { el: k, tier: 1, drop: 1, pop: specPop[k] }, n ? 1 : 0.22);
      if (n) {
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.35 + Math.sin(now * 5 + i) * 0.2;
        ctx.drawImage(glow(EL[k].c), r.x - r.s * 0.3, r.y - r.s * 0.3, r.s * 1.6, r.s * 1.6);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
      }
      if (n > 1) {
        const bx = r.x + r.s - 4, by = r.y + 4;
        ctx.beginPath(); ctx.arc(bx, by, 10, 0, TAU); ctx.fillStyle = "#ff3b5c"; ctx.fill();
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
        font(800, 12); ctx.fillStyle = "#ffffff"; ctx.fillText(fmt(n), bx, by + 1);
      }
    }
  }

  function bubble(text, x, y) {
    font(800, 16);
    const w = ctx.measureText(text).width + 26, h = 34;
    const bx = clamp(x - w / 2, 8, W - w - 8), by = y - h - 10 + Math.sin(now * 6) * 4;
    ctx.fillStyle = "rgba(0,0,20,0.35)";
    rrPath(ctx, bx, by + 3, w, h, 17); ctx.fill();
    ctx.fillStyle = "#ffffff";
    rrPath(ctx, bx, by, w, h, 17); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 8, by + h - 1); ctx.lineTo(x + 8, by + h - 1); ctx.lineTo(x, by + h + 9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#1d2470"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(text, bx + w / 2, by + h / 2 + 1);
  }
  function drawHints() {
    if (rage) return;
    if (!settings.tutMatch && hintMove && boardState === "idle" && hintMove[0] !== hintMove[1]) {
      const a = cellCenter(hintMove[0][0], hintMove[0][1]), b = cellCenter(hintMove[1][0], hintMove[1][1]);
      bubble(tr("matchHint"), (a.x + b.x) / 2, Math.min(a.y, b.y) - cell * 0.45);
      return;
    }
    if (!settings.tutBlast && boardState === "idle") {
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (grid[r][c] && grid[r][c].sp) { const p = cellCenter(r, c); bubble(tr("tapSpecial"), p.x, p.y - cell * 0.45); return; }
      }
    }
    if (!settings.tutSpecial) {
      for (let i = 0; i < SPECIALS.length; i++) if (powers[SPECIALS[i]]) { const r = specRect(i); bubble(tr("tapHint"), r.x + r.s / 2, r.y - 4); return; }
    }
  }

  function drawCombo() {
    const boss = state === "play" && enemies.find((e) => e.boss && !e.dead);
    if (boss) {
      const w = Math.min(240, W - 110), x = cx - w / 2, y = hudH + 4, f = clamp(boss.hp / boss.maxHp, 0, 1);
      rrPath(ctx, x - 3, y - 3, w + 6, 16, 8); ctx.fillStyle = "rgba(10,8,30,0.8)"; ctx.fill();
      if (f > 0) {
        const g = ctx.createLinearGradient(0, y, 0, y + 10); g.addColorStop(0, "#ff9a7a"); g.addColorStop(1, "#c81e2a");
        rrPath(ctx, x, y, Math.max(10, w * f), 10, 5); ctx.fillStyle = g; ctx.fill();
      }
      ctx.drawImage(SPR.boss.img, x - 30, y - 12, 34, 34);
    }
    if (state === "play" && combo >= 2) {
      const sz = 26 * (1 + comboPop * 0.35);
      const c = combo >= 20 ? "#ff8af0" : combo >= 10 ? "#ffe066" : "#8fe3ff";
      const yy = hudH + (boss ? 34 : 14);
      chunkyText(tr("combo") + " ×" + fmt(combo), cx, yy, sz, c);
      const w = 90 * clamp(comboT / COMBO_WINDOW, 0, 1);
      if (w > 0) { rrPath(ctx, cx - w / 2, yy + 18, w, 5, 2.5); ctx.fillStyle = c; ctx.fill(); }
    }
    if (banner && state === "play") {
      const k = banner.t / 1.8, pop = k > 0.85 ? 0.6 + ((1 - k) / 0.15) * 0.5 : 1;
      ctx.globalAlpha = Math.min(1, k * 4);
      chunkyText(banner.text, cx, cy - coreR - 80, 40 * pop, "#ffffff", "#22348f");
      ctx.globalAlpha = 1;
    }
  }

  function drawRage() {
    const col = EL[rage.el];
    const pulse = 0.5 + Math.sin(now * 12) * 0.5;
    const vg = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.25, cx, cy, Math.max(W, H) * 0.75);
    vg.addColorStop(0, rgba(col.c, 0)); vg.addColorStop(1, rgba(col.c, 0.32 + pulse * 0.12));
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    const y = hudH + 64;
    const wob = Math.sin(now * 9) * 0.04;
    ctx.save();
    ctx.translate(cx, y); ctx.rotate(wob); ctx.scale(1 + pulse * 0.06, 1 + pulse * 0.06);
    chunkyText(tr("rage"), 0, 0, Math.min(46, W * 0.11), "#ffffff", col.dark);
    ctx.restore();
    chunkyText(tr("swipe"), cx, y + 36, 18, col.c2, "#1a1035");
    const w = Math.min(220, W - 80), f = clamp(rage.t / RAGE_TIME, 0, 1);
    rrPath(ctx, cx - w / 2, y + 56, w, 10, 5); ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fill();
    if (f > 0) { rrPath(ctx, cx - w / 2, y + 56, Math.max(10, w * f), 10, 5); ctx.fillStyle = col.c; ctx.fill(); }

    if (blade.length > 1) {
      ctx.globalCompositeOperation = "lighter";
      for (let i = 1; i < blade.length; i++) {
        const a = blade[i - 1], b = blade[i];
        const k = 1 - b.age / 0.25, along = i / blade.length;
        ctx.strokeStyle = rgba(col.c, 0.55 * k); ctx.lineWidth = (6 + 18 * along) * k;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${k})`; ctx.lineWidth = (2 + 6 * along) * k;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      const h = blade[blade.length - 1];
      ctx.drawImage(glow("#ffffff"), h.x - 16, h.y - 16, 32, 32);
      ctx.globalCompositeOperation = "source-over";
    }
  }

  // ---- Input -----------------------------------------------------------
  function pos(ev) { const r = canvas.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
  const inBoard = (x, y) => x >= boardX - 6 && x <= boardX + cell * COLS + 6 && y >= boardY - 6 && y <= boardY + cell * ROWS + 6;
  const boardCell = (x, y) => [clamp(Math.floor((y - boardY) / cell), 0, ROWS - 1), clamp(Math.floor((x - boardX) / cell), 0, COLS - 1)];
  canvas.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    if (state !== "play" || ptr.down) return;
    const p = pos(ev);
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    Object.assign(ptr, { down: true, id: ev.pointerId, x: p.x, y: p.y, sx: p.x, sy: p.y, lx: p.x, ly: p.y, spec: -1, cell: null, swiped: false });
    if (rage) { blade = [{ x: p.x, y: p.y, age: 0 }]; return; }
    if (inBoard(p.x, p.y)) { ptr.cell = boardCell(p.x, p.y); return; }
    for (let i = 0; i < SPECIALS.length; i++) {
      const r = specRect(i);
      if (p.x >= r.x - 6 && p.x <= r.x + r.s + 6 && p.y >= r.y - 6 && p.y <= r.y + r.s + 6) ptr.spec = i;
    }
  });
  canvas.addEventListener("pointermove", (ev) => {
    if (!ptr.down || ev.pointerId !== ptr.id) return;
    const p = pos(ev);
    ptr.x = p.x; ptr.y = p.y;
    if (rage) slice(ptr.lx, ptr.ly, p.x, p.y);
    else if (ptr.cell && !ptr.swiped) {
      const dx = p.x - ptr.sx, dy = p.y - ptr.sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) > cell * 0.32) {
        ptr.swiped = true;
        const [r, c] = ptr.cell;
        const t = Math.abs(dx) > Math.abs(dy) ? [r, c + Math.sign(dx)] : [r + Math.sign(dy), c];
        if (t[0] >= 0 && t[0] < ROWS && t[1] >= 0 && t[1] < COLS) trySwap([r, c], t);
      }
    }
    ptr.lx = p.x; ptr.ly = p.y;
  });
  function release(ev, cancelled) {
    if (!ptr.down || ev.pointerId !== ptr.id) return;
    ptr.down = false;
    if (ptr.cell && !ptr.swiped && !cancelled && !rage && boardState === "idle") {
      const [r, c] = ptr.cell;
      if (selected && Math.abs(selected[0] - r) + Math.abs(selected[1] - c) === 1) trySwap(selected, [r, c]);
      else if (grid[r][c] && grid[r][c].sp && !selected) tapSpecial(r, c);
      else if (selected && selected[0] === r && selected[1] === c) selected = null;
      else { selected = [r, c]; sfx("click"); }
    }
    if (ptr.spec >= 0 && !cancelled) {
      const r = specRect(ptr.spec);
      if (ptr.x >= r.x - 10 && ptr.x <= r.x + r.s + 10 && ptr.y >= r.y - 10 && ptr.y <= r.y + r.s + 10) castSpecial(ptr.spec);
    }
    ptr.cell = null; ptr.spec = -1;
  }
  canvas.addEventListener("pointerup", (ev) => release(ev, false));
  canvas.addEventListener("pointercancel", (ev) => release(ev, true));
  canvas.addEventListener("contextmenu", (ev) => ev.preventDefault());
  document.addEventListener("pointerdown", () => audio(), { passive: true });
  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" || ev.key === "p") { if (state === "play") pauseGame(); else if (state === "paused") resumeGame(); return; }
    if (state !== "play" || rage) return;
    const n = parseInt(ev.key, 10);
    if (n >= 1 && n <= SPECIALS.length) castSpecial(n - 1);
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden) pauseGame(); });

  const clickSfx = (fn) => () => { sfx("click"); fn(); };
  $("playBtn").addEventListener("click", clickSfx(() => openIntro(progress.unlocked, "title")));
  $("againBtn").addEventListener("click", () => startGame());
  $("restartBtn").addEventListener("click", () => startGame());
  $("mapBtn").addEventListener("click", clickSfx(openMap));
  $("endlessBtn").addEventListener("click", () => startGame("endless"));
  $("mapBack").addEventListener("click", clickSfx(() => showScreen("titleScreen")));
  $("inStart").addEventListener("click", () => startGame("levels", levelN));
  $("inBack").addEventListener("click", clickSfx(openMap));
  $("winNext").addEventListener("click", clickSfx(() => openIntro(levelN + 1, "map")));
  $("winMap").addEventListener("click", clickSfx(openMap));
  $("winShare").addEventListener("click", clickSfx(() => share(tr("challengeText", score))));
  $("pauseBtn").addEventListener("click", clickSfx(pauseGame));
  $("resumeBtn").addEventListener("click", clickSfx(resumeGame));
  $("pauseMenuBtn").addEventListener("click", clickSfx(toMenu));
  $("overMenuBtn").addEventListener("click", clickSfx(toMenu));
  $("titleSettings").addEventListener("click", clickSfx(() => openSettings("title")));
  $("pauseSettingsBtn").addEventListener("click", clickSfx(() => openSettings("pause")));
  $("settingsDone").addEventListener("click", clickSfx(closeSettings));
  $("titleLbBtn").addEventListener("click", clickSfx(() => openLeaderboard("title")));
  $("titleInviteBtn").addEventListener("click", clickSfx(() => share(tr("inviteText"))));
  $("ovShareBtn").addEventListener("click", clickSfx(() => share(tr("challengeText", score))));
  $("ovLbBtn").addEventListener("click", clickSfx(() => openLeaderboard("over")));
  $("lbDone").addEventListener("click", clickSfx(closeLeaderboard));
  $("titleRecBtn").addEventListener("click", clickSfx(() => openRecords("title")));
  $("ovRecBtn").addEventListener("click", clickSfx(() => openRecords("over")));
  $("recDone").addEventListener("click", clickSfx(closeRecords));
  $("soundSw").addEventListener("click", () => {
    settings.sound = !settings.sound; saveSettings();
    $("soundSw").setAttribute("aria-checked", String(settings.sound));
    sfx("click");
  });
  $("vibSw").addEventListener("click", () => {
    settings.vib = !settings.vib; saveSettings();
    $("vibSw").setAttribute("aria-checked", String(settings.vib));
    haptic("medium"); sfx("click");
  });

  // ---- Boot ------------------------------------------------------------
  if (tg) {
    try {
      tg.ready(); tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      if (tg.setHeaderColor) tg.setHeaderColor("#070b2a");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#070b2a");
      if (tg.BackButton) tg.BackButton.onClick(onBack);
    } catch (e) {}
  }
  if (CHARACTER_IMAGE) $("titlePortrait").src = CHARACTER_IMAGE;
  document.querySelectorAll(".die-img").forEach((img) => { img.src = dieDataURL(img.dataset.el); });
  if (document.fonts && document.fonts.load) {
    ["Baloo 2", "Vazirmatn", "Nunito"].forEach((f) => document.fonts.load(`800 20px "${f}"`).catch(() => {}));
  }

  loadStats();
  loadProgress();
  buildEnemySprites();
  layout();
  setLang();
  setTheme(levelDef(progress.unlocked).w);
  reset();
  showScreen("titleScreen");
  if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
  else window.addEventListener("resize", layout);

  let last = performance.now();
  function loop(t) {
    const dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
    last = t; now = t / 1000;
    update(dt);
    render();
    if (state !== "title") updateHud();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
