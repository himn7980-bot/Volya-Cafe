<title>Dice &amp; Chain Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&family=Vazirmatn:wght@600;700;800&display=swap">
<style>
/* Layout: full-height stage. Canvas = arena + dice tray; DOM = HUD and menus layered on top. Cartoon night-sky look taken from the Volya poster. */
:root {
  --ink: #070b2a;
  --panel-top: #2b3a96;
  --panel-bot: #18215e;
  --text: #f5f7ff;
  --muted: #b3bdf0;
  --gold: #ffcf3d;
  --gold-hi: #ffe98a;
  --gold-deep: #b86400;
  --blue: #4d74ff;
  --blue-deep: #22348f;
  --red: #ff4a3d;
  --red-deep: #9e1426;
  --green: #5fe07a;
  --font: "Baloo 2", "Vazirmatn", "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
.stage { position: relative; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; }
#game { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 3px; }

/* ---------- HUD ---------- */
.hud {
  position: absolute; inset: 0 0 auto 0; z-index: 5;
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px 0;
  pointer-events: none;
}
.hud-side { display: flex; flex-direction: column; gap: 6px; width: 132px; flex: none; }
.hp {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 10px 5px 6px;
  border-radius: 999px;
  background: rgba(8, 12, 44, 0.7);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1);
}
.hp svg { width: 22px; height: 22px; flex: none; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
.hp-bar { flex: 1; height: 12px; border-radius: 999px; background: rgba(0,0,0,0.45); overflow: hidden; }
.hp-bar i {
  display: block; height: 100%; width: 100%; border-radius: 999px;
  background: linear-gradient(#9dffb0, var(--green) 55%, #2fae4c);
  transition: width .25s ease, background .3s;
}
.hp.low .hp-bar i { background: linear-gradient(#ffb0a6, var(--red) 55%, #c21d2b); }
.hp.low svg { animation: beat .5s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.2); } }
.wave-chip {
  align-self: flex-start;
  padding: 1px 12px 0;
  border-radius: 999px;
  background: rgba(8, 12, 44, 0.7);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1);
  font-weight: 800; font-size: 14px; color: var(--muted);
}
.score-box { flex: 1; min-width: 0; text-align: center; line-height: 1; }
.score {
  font-weight: 800; font-size: 34px;
  color: #fff;
  text-shadow: 0 3px 0 #1a2270, 0 0 18px rgba(90,140,255,.6);
  font-variant-numeric: tabular-nums;
  transition: transform .1s;
}
.score.bump { transform: scale(1.12); }
.best {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 2px;
  font-weight: 800; font-size: 15px; color: var(--gold);
  text-shadow: 0 2px 0 rgba(0,0,0,.4);
}
.best svg { width: 16px; height: 16px; }
.hud-end { width: 132px; display: flex; justify-content: flex-end; flex: none; }
.iconbtn {
  pointer-events: auto;
  width: 48px; height: 48px; border-radius: 50%; border: 0; padding: 0;
  display: grid; place-items: center;
  background: linear-gradient(#7193ff, var(--blue) 60%, #3b58d6);
  color: #fff;
  box-shadow: 0 5px 0 var(--blue-deep), 0 8px 16px rgba(0,0,0,.35);
  cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.iconbtn svg { width: 24px; height: 24px; }
.iconbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--blue-deep), 0 4px 8px rgba(0,0,0,.35); }

/* ---------- Screens ---------- */
.screen {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center;
  padding-inline: 16px; padding-block: 16px 24px;
  overflow-y: auto;
  background: radial-gradient(110% 70% at 50% 25%, rgba(40,70,190,.55), rgba(5,8,30,.92) 70%);
  touch-action: pan-y;
  animation: fadein .25s ease-out;
}
.screen.center { justify-content: center; }
@keyframes fadein { from { opacity: 0; } }
.screen > * { flex: none; }
.corner { position: absolute; top: 12px; inset-inline-end: 12px; }

.title-wrap { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; gap: 12px; margin-block: auto; padding-top: 20px; }
.portrait {
  width: 132px; height: 132px; border-radius: 50%;
  padding: 5px;
  background: linear-gradient(var(--gold-hi), #e09a14);
  box-shadow: 0 0 0 5px #c81e2a, 0 0 40px rgba(80,140,255,.8), 0 12px 24px rgba(0,0,0,.4);
  animation: float 3s ease-in-out infinite;
}
.portrait img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background: #13206b; }
@keyframes float { 50% { transform: translateY(-8px); } }
.logo {
  margin: 6px 0 0;
  font-family: "Baloo 2", system-ui, sans-serif;
  font-weight: 800; font-size: clamp(56px, 18vw, 80px); line-height: .9;
  letter-spacing: .04em;
  background: linear-gradient(#ffb36b, #ff4a2a 45%, #c4101c);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #4a0710) drop-shadow(0 0 22px rgba(255,90,40,.55));
}
.subtitle { margin: 0; font-weight: 800; font-size: 18px; color: #9fdcff; text-align: center; text-wrap: balance; }
.tagline { margin: 0 0 6px; font-weight: 700; font-size: 16px; color: var(--muted); text-align: center; text-wrap: balance; }

.btn {
  appearance: none; border: 0; cursor: pointer;
  width: 100%;
  min-height: 54px;
  padding: 10px 22px 8px;
  border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font-weight: 800; font-size: 21px; line-height: 1.1;
  transition: transform .08s, box-shadow .08s;
}
.btn svg { width: 24px; height: 24px; flex: none; }
.btn.primary {
  background: linear-gradient(var(--gold-hi), var(--gold) 50%, #ff9d00);
  color: #4a2300;
  box-shadow: 0 6px 0 var(--gold-deep), 0 12px 24px rgba(0,0,0,.35);
}
.btn.primary:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--gold-deep), 0 4px 10px rgba(0,0,0,.35); }
.btn.secondary {
  background: linear-gradient(#7193ff, var(--blue) 60%, #3b58d6);
  color: #fff;
  box-shadow: 0 6px 0 var(--blue-deep), 0 12px 24px rgba(0,0,0,.3);
}
.btn.secondary:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--blue-deep); }
.btn.ghost { background: rgba(255,255,255,.08); color: var(--text); box-shadow: inset 0 0 0 2px rgba(255,255,255,.16); min-height: 48px; font-size: 18px; }
.btn.ghost:active { transform: scale(.97); }
.btn.big { min-height: 66px; font-size: 28px; }
.btn.big svg { width: 30px; height: 30px; }

.card {
  width: 100%; max-width: 400px;
  padding: 18px;
  border-radius: 28px;
  background: linear-gradient(rgba(43,58,150,.96), rgba(24,33,94,.96));
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 20px 40px rgba(0,0,0,.45);
  display: flex; flex-direction: column; gap: 12px;
}
.card h2 { margin: 0; font-weight: 800; font-size: 26px; text-align: center; line-height: 1.1; text-wrap: balance; }
.card h3 { margin: 4px 0 0; font-weight: 800; font-size: 15px; color: var(--muted); letter-spacing: .04em; }

.elements { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.el-card {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 10px 4px 8px; border-radius: 18px;
  background: rgba(0,0,0,.2);
  text-align: center; min-width: 0;
}
.el-card img { width: 52px; height: 52px; }
.el-card b { font-size: 17px; font-weight: 800; line-height: 1.2; }
.el-card small { font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.el-card.fire b { color: #ff8a5c; }
.el-card.ice b { color: #7fe3ff; }
.el-card.bolt b { color: #ffd84d; }
.tips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tips li {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px; border-radius: 16px; background: rgba(0,0,0,.2);
  font-weight: 700; font-size: 15px; line-height: 1.3;
}
.tips li > span:last-child { min-width: 0; }
.tip-ico { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.08); }
.tip-ico svg { width: 26px; height: 26px; }

.big-score { text-align: center; line-height: 1; }
.big-score small { display: block; font-weight: 800; font-size: 15px; color: var(--muted); }
.big-score b { display: block; font-weight: 800; font-size: 56px; color: #fff; text-shadow: 0 4px 0 #1a2270; margin-top: 4px; }
.badge {
  align-self: center;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 14px 2px; border-radius: 999px;
  background: rgba(255,207,61,.16); color: var(--gold);
  font-weight: 800; font-size: 17px;
}
.badge svg { width: 18px; height: 18px; }
.badge.new { background: linear-gradient(var(--gold-hi), var(--gold)); color: #4a2300; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats div { padding: 8px 4px; border-radius: 16px; background: rgba(0,0,0,.22); text-align: center; min-width: 0; }
.stats small { display: block; font-weight: 700; font-size: 12px; color: var(--muted); line-height: 1.2; }
.stats b { display: block; font-weight: 800; font-size: 22px; line-height: 1.2; }
.over-title { color: #ff8a7a; }

.langs {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
  max-height: 38vh; overflow-y: auto; padding: 2px;
  touch-action: pan-y;
}
.lang {
  appearance: none; border: 2px solid transparent; cursor: pointer;
  min-height: 46px; padding: 6px 12px; border-radius: 16px;
  background: rgba(0,0,0,.22); color: var(--text);
  font-weight: 700; font-size: 16px; text-align: start; line-height: 1.2;
  display: flex; flex-direction: column; justify-content: center;
  min-width: 0; overflow-wrap: anywhere;
}
.lang.auto { grid-column: 1 / -1; }
.lang small { font-size: 13px; color: var(--muted); font-weight: 700; }
.lang[aria-pressed="true"] { border-color: var(--gold); background: rgba(255,207,61,.14); }
.toggle-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 8px; padding-inline: 14px 8px; border-radius: 16px; background: rgba(0,0,0,.22);
  font-weight: 800; font-size: 18px;
}
.switch {
  appearance: none; border: 0; cursor: pointer; flex: none;
  width: 60px; height: 34px; border-radius: 999px; padding: 3px;
  background: rgba(255,255,255,.18);
  display: flex; transition: background .2s;
}
.switch i { width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.3); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--green); }
.switch[aria-checked="true"] i { transform: translateX(26px); }
[dir="rtl"] .switch[aria-checked="true"] i { transform: translateX(-26px); }

@media (prefers-reduced-motion: reduce) {
  .portrait, .badge.new, .hp.low svg { animation: none; }
}
</style>

<div class="stage" id="stage">
  <canvas id="game" tabindex="0" aria-label="Dice and Chain Defense"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hud-side">

      <div class="best"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v3h3a1 1 0 011 1c0 3-2 5-4.5 5.4A5 5 0 0113 15.9V18h3v3H8v-3h3v-2.1a5 5 0 01-3.5-3.5C5 12 3 10 3 7a1 1 0 011-1h3z" fill="currentColor"/></svg><span id="best">0</span></div>

    </button>
    <div class="title-wrap">
      <div class="portrait"><img id="titlePortrait" alt="Volya"></div>
      <h1 class="logo">VOLYA</h1>
      <p class="subtitle" data-i18n="subtitle"></p>
      <p class="tagline" data-i18n="tagline"></p>
      <button class="btn primary big" id="playBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 001.5.9l10-6.5a1 1 0 000-1.7l-10-6.5A1 1 0 008 5.5z" fill="currentColor"/></svg>

      <div class="card">
        <h2 data-i18n="howTo"></h2>
        <div class="elements">
          <div class="el-card fire"><img class="die-img" data-el="fire" alt=""><b data-i18n="fire"></b><small data-i18n="fireNote"></small></div>
          <div class="el-card ice"><img class="die-img" data-el="ice" alt=""><b data-i18n="ice"></b><small data-i18n="iceNote"></small></div>

        </ul>
      </div>
    </div>
  </section>

  <section class="screen center" id="pauseScreen" hidden>
    <div class="card">
      <h2 data-i18n="paused"></h2>

  <section class="screen center" id="overScreen" hidden>
    <div class="card">
      <h2 class="over-title" data-i18n="gameOver"></h2>

<script>
(function () {
  "use strict";

  // ---- Layout ----------------------------------------------------------
  let W, H, dpr, S, cx, cy, coreR, hudH, trayTop, slotSize, slotGap, slotX0, slotY, bg, starsBg = [];
  function layout() {

    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    hudH = 84;
    slotGap = 8;
    slotSize = Math.min(70, (W - 44 - slotGap * (SLOT_COUNT - 1)) / SLOT_COUNT);
    trayTop = H - (slotSize + 62);
    slotX0 = (W - (SLOT_COUNT * slotSize + (SLOT_COUNT - 1) * slotGap)) / 2;
    slotY = trayTop + 38;
    cx = W / 2;
    cy = (hudH + trayTop) / 2 + 8;
    S = clamp(Math.min(W, trayTop - hudH) / 400, 0.8, 1.5);
    coreR = clamp(Math.min(W, trayTop - hudH) * 0.085, 28, 42);
    buildBg();
    buildDiceSprites();
  }
  function buildBg() {
    bg = mk(canvas.width, canvas.height);
    const b = bg.getContext("2d");
    b.scale(dpr, dpr);
    const base = b.createRadialGradient(cx, cy, 0, cx, cy, Math.hypot(W, H) * 0.65);
    base.addColorStop(0, "#22389e"); base.addColorStop(0.35, "#15226e"); base.addColorStop(0.7, "#0b1243"); base.addColorStop(1, "#060a26");

      const x = rand(0, W), y = rand(0, H), r = rand(80, 220);
      const g = b.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, blobs[i % blobs.length]); g.addColorStop(1, "rgba(0,0,0,0)");
      b.fillStyle = g; b.fillRect(x - r, y - r, r * 2, r * 2);
    }
    // glowing arena platform under Volya
    const pr = Math.min(W, trayTop - hudH) * 0.42;
    const pg = b.createRadialGradient(cx, cy, 0, cx, cy, pr);
    pg.addColorStop(0, "rgba(110,160,255,0.28)"); pg.addColorStop(0.7, "rgba(80,120,255,0.1)");

  // ---- Spawning --------------------------------------------------------
  function spawn(forceType) {

    if (!forceType) { if (t > 40 && r < 0.14) type = "brute"; else if (t > 18 && r < 0.42) type = "runner"; }
    const d = ENEMY[type];
    const hpScale = 1 + t / 70;
    const m = d.r * 2;
    let x, y;
    switch ((Math.random() * 4) | 0) {
      case 0: x = rand(0, W); y = -m; break;
      case 1: x = W + m; y = rand(hudH * 0.5, trayTop); break;
      case 2: x = rand(0, W); y = trayTop + m; break;
      default: x = -m; y = rand(hudH * 0.5, trayTop);
    }
    enemies.push({
      type, x, y, r: d.r, hp: d.hp * hpScale, maxHp: d.hp * hpScale,
      speed: d.speed * Math.min(1 + t / 120, 2.4) * S, dmg: d.dmg, pts: d.pts, c: d.c,
      frozen: 0, slow: 0, flash: 0, hit: 0, kx: 0, ky: 0, phase: rand(0, TAU), dead: false

  // ---- Combat ----------------------------------------------------------
  function nearestEnemy(x, y, exclude, maxD) {
    let bestE = null, bd = maxD * maxD;
    for (const e of enemies) {
      if (e.dead || (exclude && exclude.has(e))) continue;

      const dx = e.x - fromX, dy = e.y - fromY, d = Math.hypot(dx, dy) || 1;
      e.kx += (dx / d) * push; e.ky += (dy / d) * push;

  }
  function kill(e, how, ang) {

    e.dead = true;

    const mult = 1 + (combo - 1) * 0.1;

    score += pts;
    addText("+" + fmt(pts), e.x, e.y - e.r, how === "slice" ? "#ffffff" : "#ffe066", 18 + Math.min(combo, 20) * 0.5, 0.85);

    if (d.el === "bolt") { lightning(d.tier, tx, ty); return; }
    sfx(d.el === "fire" ? "castFire" : "castIce");
    const a = Math.atan2(ty - cy, tx - cx);
    projectiles.push({ el: d.el, tier: d.tier, x: cx + Math.cos(a) * coreR, y: cy + Math.sin(a) * coreR,
      tx, ty, speed: 680 * S, r: 7 + d.tier * 3, spin: 0 });
  }
  function detonate(p) {
    const t = p.tier;
    if (p.el === "fire") {
      const R = FIRE.R[t] * S;
      for (const e of enemies) if (Math.hypot(e.x - p.x, e.y - p.y) < R + e.r) damage(e, FIRE.dmg[t], p.x, p.y, 60 + t * 30);
      emit("glow", p.x, p.y, { n: 1, spd: [0, 0], life: [0.28, 0.28], size: [R * 1.3, R * 1.3], colors: ["#ffd27a"], grow: 0.8 });
      emit("glow", p.x, p.y, { n: 10 + t * 6, spd: [40, R * 2.4], life: [0.45, 0.8], size: [R * 0.3, R * 0.55], colors: ["#ff5a1f", "#ff9a2f", "#ffd84d", "#ff3b30"], drag: 0.86, grow: 0.5 });
      emit("smoke", p.x, p.y, { n: 5 + t * 3, spd: [20, 70], life: [0.9, 1.5], size: [R * 0.3, R * 0.5], colors: ["#2a2145", "#3b2a4a"], vy: -40, grow: 0.9, drag: 0.95 });
      emit("spark", p.x, p.y, { n: 14 + t * 8, spd: [260, 620], life: [0.35, 0.7], size: [2, 3.5], colors: ["#ffd84d", "#fff2b0", "#ff9a2f"], drag: 0.9, g: 200 });
      emit("goo", p.x, p.y, { n: 6 + t * 4, spd: [150, 380], life: [0.5, 0.9], size: [2.5, 5], colors: ["#ffcf3d", "#ff7a2f"], g: 600, vy: -120 });
      ring(p.x, p.y, R, "#ffb03a", 0.45, 12);
      decal(p.x, p.y, R * 0.9, "#14060a", 2.6, 0.5);

    } else {

        e.slow = Math.max(e.slow, fz + 2.5);

      emit("glow", p.x, p.y, { n: 6 + t * 2, spd: [30, R * 1.5], life: [0.5, 0.8], size: [R * 0.25, R * 0.45], colors: ["#3fd0ff", "#9fe8ff"], drag: 0.88, grow: 0.6 });
      emit("shard", p.x, p.y, { n: 10 + t * 6, spd: [160, 420], life: [0.55, 0.9], size: [5, 10], colors: ["#e6fbff", "#9fe8ff", "#6cd3ff"], drag: 0.9, vr: 10 });
      emit("flake", p.x, p.y, { n: 8 + t * 4, spd: [40, 170], life: [1.0, 1.7], size: [5, 10], colors: ["#ffffff"], drag: 0.95, vr: 3, vy: 15 });
      ring(p.x, p.y, R, "#7fe9ff", 0.6, 10);

  }
  function lightning(t, tx, ty) {
    const hit = new Set(), pts = [{ x: cx, y: cy }];
    let cur = nearestEnemy(tx, ty, null, Infinity);
    sfx("zap");
    if (!cur) {
      pts.push({ x: tx, y: ty });
      bolts.push({ pts, life: 0.3, max: 0.3, w: t, path: null, next: 0 });
      emit("spark", tx, ty, { n: 10, spd: [100, 300], life: [0.2, 0.4], size: [2, 3], colors: ["#fff6c2"] });

      hit.add(cur);

      emit("glow", cur.x, cur.y, { n: 1, spd: [0, 0], life: [0.25, 0.25], size: [30 + t * 8, 30 + t * 8], colors: ["#fff3a0"] });
      emit("spark", cur.x, cur.y, { n: 8 + t * 3, spd: [150, 420], life: [0.25, 0.5], size: [1.5, 3], colors: ["#ffe14d", "#ffffff", "#9fe8ff"], drag: 0.9 });
      damage(cur, BOLT.dmg[t] * Math.pow(0.92, i), cx, cy, 20);
      i++;

  // ---- Dice tray -------------------------------------------------------
  const slotIndexAt = (i) => (rtl ? SLOT_COUNT - 1 - i : i);
  const slotRect = (i) => ({ x: slotX0 + slotIndexAt(i) * (slotSize + slotGap), y: slotY, s: slotSize });
  function hitSlot(x, y, pad = 0) {
    for (let i = 0; i < SLOT_COUNT; i++) {
      const r = slotRect(i);

    }
    return -1;
  }
  const canMerge = (a, b) => a && b && a !== b && a.el === b.el && a.tier === b.tier && a.tier < MAX_TIER;
  function dropDie() {
    const idx = slots.indexOf(null);
    if (idx < 0) return false;
    // A drop never completes a row of three by itself: Rage Mode is earned by arranging dice.
    const makesTriple = (el) => {
      for (let k = Math.max(0, idx - 2); k <= Math.min(idx, SLOT_COUNT - 3); k++) {
        if ([k, k + 1, k + 2].every((j) => j === idx || (slots[j] && slots[j].el === el))) return true;
      }
      return false;
    };
    const safe = ELS.filter((el) => !makesTriple(el));
    slots[idx] = die(pick(safe.length ? safe : ELS));
    sfx("drop");
    checkRage();
    return true;
  }
  function moveDie(from, to) {
    const a = slots[from], b = slots[to];
    if (!b) { slots[to] = a; slots[from] = null; sfx("click"); }
    else if (canMerge(a, b)) {
      const m = die(a.el, a.tier + 1);
      m.drop = 1; m.pop = 1;
      slots[to] = m; slots[from] = null;
      const r = slotRect(to), mx = r.x + r.s / 2, my = r.y + r.s / 2;
      emit("glow", mx, my, { n: 8, spd: [40, 160], life: [0.3, 0.6], size: [10, 20], colors: [EL[a.el].c, EL[a.el].c2] });
      emit("star", mx, my, { n: 6, spd: [120, 260], life: [0.6, 0.9], size: [6, 10], colors: ["#ffd84d"], g: 500, vy: -260, vr: 8 });
      addText(tr("powerUp"), mx, r.y - 12, "#ffe066", 20, 0.9);
      if (!settings.tutMerge) { settings.tutMerge = true; saveSettings(); }
      sfx("merge");
      haptic("success");
    } else { slots[to] = a; slots[from] = b; sfx("click"); }
    checkRage();
  }
  function useSlot(i, tx, ty) {
    const d = slots[i];
    if (!d) return;
    slots[i] = null;
    cast(d, tx, ty);
  }
  function checkRage() {
    if (rage || state !== "play") return;
    for (let i = 0; i <= SLOT_COUNT - 3; i++) {
      const a = slots[i], b = slots[i + 1], c = slots[i + 2];

    }
  }
  function triggerRage(el, start) {
    for (let k = start; k < start + 3; k++) {

      emit("star", r.x + r.s / 2, r.y + r.s / 2, { n: 4, spd: [150, 300], life: [0.7, 1], size: [6, 10], colors: ["#ffd84d"], g: 400, vy: -300, vr: 8 });

  // ---- Screens & flow --------------------------------------------------
  let settingsReturn = "title";
  function showScreen(id) {
    for (const s of ["titleScreen", "pauseScreen", "overScreen", "settingsScreen"]) $(s).hidden = s !== id;
    $("hud").hidden = !(state === "play" || state === "paused" || state === "over");
    syncBackButton();
  }
  function syncBackButton() {
    const bb = tg && tg.BackButton;
    if (!bb) return;
    try { if (state === "title" && $("settingsScreen").hidden) bb.hide(); else bb.show(); } catch (e) {}
  }
  function onBack() {
    if (!$("settingsScreen").hidden) closeSettings();
    else if (state === "play") pauseGame();
    else if (state === "paused") resumeGame();
    else if (state === "over") toMenu();
  }
  function startGame() {
    reset();
    state = "play"; stateT = 0;
    showScreen(null);
    sfx("wave");
    haptic("medium");
    canvas.focus({ preventScroll: true });
  }
  function pauseGame() {
    if (state !== "play") return;
    state = "paused";
    ptr.down = false; ptr.slot = -1; ptr.dragging = false;
    showScreen("pauseScreen");
  }
  function resumeGame() {
    if (state !== "paused") return;
    state = "play";
    showScreen(null);
    canvas.focus({ preventScroll: true });
  }
  function toMenu() {
    state = "title";
    reset();
    showScreen("titleScreen");
  }
  function openSettings(from) {
    settingsReturn = from;
    $("soundSw").setAttribute("aria-checked", String(settings.sound));
    $("vibSw").setAttribute("aria-checked", String(settings.vib));
    showScreen("settingsScreen");
  }
  function closeSettings() {
    showScreen(settingsReturn === "pause" ? "pauseScreen" : "titleScreen");
  }
  function gameOver() {
    state = "over"; stateT = 0; rage = null;
    emit("glow", cx, cy, { n: 20, spd: [60, 400], life: [0.6, 1.2], size: [20, 40], colors: ["#3d7bff", "#ff4a3d", "#ffffff", "#3fd0ff"], drag: 0.9, grow: 0.4 });
    emit("star", cx, cy, { n: 16, spd: [150, 420], life: [0.9, 1.4], size: [7, 12], colors: ["#ffd84d"], g: 300, vy: -200, vr: 8 });
    ring(cx, cy, Math.max(W, H) * 0.7, "#ff6b6b", 1.0, 14);
    addShake(22);
    for (const e of enemies) if (!e.dead) { e.dead = true; poof(e); }
    if (score > best) {
      best = score; newBest = true;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
    sfx("over");
    haptic("error");
    setTimeout(() => {
      if (state !== "over") return;
      $("ovScore").textContent = fmt(score);
      $("ovWave").textContent = fmt(wave);
      $("ovKills").textContent = fmt(kills);
      $("ovCombo").textContent = fmt(bestCombo);
      const b = $("ovBest");
      b.className = "badge" + (newBest ? " new" : "");
      b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v3h3a1 1 0 011 1c0 3-2 5-4.5 5.4A5 5 0 0113 15.9V18h3v3H8v-3h3v-2.1a5 5 0 01-3.5-3.5C5 12 3 10 3 7a1 1 0 011-1h3z" fill="currentColor"/></svg><span></span>';

  // ---- Update ----------------------------------------------------------
  function update(dt) {
    stateT += dt;
    if (state === "paused") return;
    const tsTarget = rage ? RAGE_SLOWMO : 1;
    timeScale += (tsTarget - timeScale) * Math.min(1, dt * 8);
    const wdt = dt * timeScale;

    if (state === "play") {
      if (rage) {
        rage.t -= dt;
        shake = Math.max(shake, reduceMotion ? 1.5 : 5);
        if (rage.t <= 0) { rage = null; blade = []; }
      } else {
        dropT += dt;
        if (dropT >= DROP_EVERY) dropT = dropDie() ? 0 : DROP_EVERY;
      }
      elapsed += wdt;
      if (combo > 0) { comboT -= wdt; if (comboT <= 0) combo = 0; }
      spawnT -= wdt;
      if (spawnT <= 0) { spawn(); spawnT = spawnInterval(); }
      const w = 1 + Math.floor(elapsed / 25);
      if (w > wave) {
        wave = w;
        banner = { text: tr("wave", wave), t: 1.8 };
        for (let i = 0; i < wave + 3; i++) spawn(i % 3 === 0 ? "runner" : null);
        sfx("wave");
        haptic("medium");
      }

      for (const e of enemies) {
        if (e.dead) continue;
        const dx = cx - e.x, dy = cy - e.y, d = Math.hypot(dx, dy) || 1;
        if (e.frozen > 0) e.frozen -= wdt;
        else {
          const sp = e.speed * (e.slow > 0 ? 0.45 : 1) * wdt;
          e.x += (dx / d) * sp; e.y += (dy / d) * sp;
          e.phase += wdt * (e.type === "runner" ? 14 : e.type === "brute" ? 5 : 8);
          if (e.slow > 0 && Math.random() < wdt * 4) emit("flake", e.x, e.y - e.r, { n: 1, spd: [5, 20], life: [0.6, 1], size: [4, 6], colors: ["#ffffff"], vy: 20, vr: 3 });
        }
        e.x += e.kx * wdt; e.y += e.ky * wdt;
        const kd = Math.pow(0.02, wdt); e.kx *= kd; e.ky *= kd;
        e.slow -= wdt;
        e.flash -= dt;
        e.hit = Math.max(0, e.hit - dt * 5);
        if (d < coreR + e.r * 0.7) hitCore(e);
        if (state !== "play") break;
      }

      for (const p of projectiles) {
        const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy), step = p.speed * wdt;
        let boom = d <= step;
        if (boom) { p.x = p.tx; p.y = p.ty; } else { p.x += (dx / d) * step; p.y += (dy / d) * step; }
        if (!boom) for (const e of enemies) if (!e.dead && Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r) { boom = true; break; }
        p.spin += wdt * 12;
        if (p.el === "fire") {
          emit("glow", p.x, p.y, { n: 2 + p.tier, spd: [10, 50], life: [0.2, 0.4], size: [p.r * 0.8, p.r * 1.4], colors: ["#ff5a1f", "#ff9a2f", "#ffd84d"], grow: -1.6, vy: -30, jit: 3 });
          if (Math.random() < 0.5) emit("spark", p.x, p.y, { n: 1, spd: [40, 120], life: [0.2, 0.35], size: [1.5, 2.5], colors: ["#ffd84d"] });
        } else {
          emit("glow", p.x, p.y, { n: 2, spd: [10, 40], life: [0.25, 0.4], size: [p.r * 0.6, p.r * 1.1], colors: ["#3fd0ff", "#bff4ff"], grow: -1.4, jit: 3 });
          if (Math.random() < 0.4) emit("flake", p.x, p.y, { n: 1, spd: [20, 60], life: [0.4, 0.7], size: [4, 6], colors: ["#ffffff"], vr: 4 });
        }
        if (boom) { p.done = true; detonate(p); }
      }
      projectiles = projectiles.filter((p) => !p.done);
      enemies = enemies.filter((e) => !e.dead);
    }

    for (const p of particles) {
      if (p.drag !== 1) { const f = Math.pow(p.drag, wdt * 60); p.vx *= f; p.vy *= f; }
      p.vy += p.g * wdt;
      p.x += p.vx * wdt; p.y += p.vy * wdt;
      p.life -= wdt;
      p.rot += p.vr * wdt;

    particles = particles.filter((p) => p.life > 0);
    for (const t of texts) { t.y += t.vy * dt; t.life -= dt; }

    for (const r of rings) r.life -= wdt;
    rings = rings.filter((r) => r.life > 0);
    for (const d of decals) d.life -= wdt;
    decals = decals.filter((d) => d.life > 0);
    for (const b of bolts) b.life -= dt;

    shake = Math.max(0, shake - dt * 30);
    flash = Math.max(0, flash - dt * 1.6);

    comboPop = Math.max(0, comboPop - dt * 4);
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
    shownScore += (score - shownScore) * Math.min(1, dt * 10);
    if (Math.abs(score - shownScore) < 1) shownScore = score;
  }

  // ---- Rage slicing ----------------------------------------------------
  function distToSeg(px, py, ax, ay, bx, by) {
    const vx = bx - ax, vy = by - ay, l = vx * vx + vy * vy || 1;
    const t = clamp(((px - ax) * vx + (py - ay) * vy) / l, 0, 1);
    return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
  }
  function slice(ax, ay, bx, by) {
    const ang = Math.atan2(by - ay, bx - ax);
    let n = 0;
    for (const e of enemies) {
      if (!e.dead && distToSeg(e.x, e.y, ax, ay, bx, by) < e.r + 16) { kill(e, "slice", ang); n++; }
    }
    if (n) {
      addShake(3 + n);
      sfx("slice");
      if (now - ptr.lastBuzz > 0.06) { haptic("light"); ptr.lastBuzz = now; }
    }
    blade.push({ x: bx, y: by, age: 0 });
  }

  // ---- HUD (DOM) -------------------------------------------------------
  function updateHud() {
    const sc = Math.round(shownScore);
    if (hudCache.score !== sc) {
      $("score").textContent = fmt(sc);
      if (hudCache.score != null && sc > hudCache.score) {
        const el = $("score"); el.classList.add("bump"); clearTimeout(hudCache.bt); hudCache.bt = setTimeout(() => el.classList.remove("bump"), 90);
      }
      hudCache.score = sc;
    }
    const b = Math.max(best, score);
    if (hudCache.best !== b) { $("best").textContent = fmt(b); hudCache.best = b; }
    if (hudCache.hp !== hp) {
      $("hpFill").style.width = (hp / MAX_HP) * 100 + "%";
      $("hpPill").classList.toggle("low", hp / MAX_HP <= 0.3);
      hudCache.hp = hp;
    }
    if (hudCache.wave !== wave) { $("waveChip").textContent = tr("wave", wave); hudCache.wave = wave; }
  }

  // ---- Render ----------------------------------------------------------
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.direction = rtl ? "rtl" : "ltr";
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.drawImage(bg, 0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";
    for (const s of starsBg) {
      ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(now * s.sp + s.ph));
      ctx.drawImage(glow("#9fc4ff"), s.x - s.s, s.y - s.s, s.s * 2, s.s * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    drawDecals();

    const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
    ctx.save();
    ctx.translate(sx, sy);
    drawEnemies();
    drawParticles(false);
    drawCore();
    drawProjectiles();
    ctx.globalCompositeOperation = "lighter";
    drawRings();
    drawBolts();
    drawParticles(true);
    ctx.globalCompositeOperation = "source-over";
    drawTexts();
    ctx.restore();

    drawTray();
    if (ptr.dragging && ptr.slot >= 0 && slots[ptr.slot]) {
      drawDie(ptr.x - slotSize * 0.55, ptr.y - slotSize * 0.75, slotSize * 1.1, slots[ptr.slot], 1);
    }
    if (state === "play") drawHints();
    drawCombo();
    if (rage) drawRage();
    if (flash > 0) {
      ctx.globalAlpha = Math.min(0.55, flash);
      ctx.fillStyle = flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  function drawDecals() {
    for (const d of decals) {
      const a = d.a * clamp(d.life / d.max, 0, 1) * Math.min(1, (d.max - d.life) * 8);
      const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.R);
      g.addColorStop(0, rgba(d.c, a)); g.addColorStop(0.7, rgba(d.c, a * 0.6)); g.addColorStop(1, rgba(d.c, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.R, 0, TAU); ctx.fill();
    }
  }

  function drawEnemies() {
    ctx.fillStyle = "rgba(0,0,20,0.35)";
    for (const e of enemies) {
      const fly = e.type === "runner";
      ctx.beginPath();
      ctx.ellipse(e.x, e.y + e.r * (fly ? 1.6 : 0.85), e.r * (fly ? 0.7 : 0.95), e.r * 0.28, 0, 0, TAU);
      ctx.fill();
    }
    for (const e of enemies) {
      const sp = SPR[e.type];
      const spr = Array.isArray(sp) ? sp[Math.sin(e.phase) > 0 ? 0 : 1] : sp;
      const face = cx < e.x ? -1 : 1;

  let coreImg = null;
  if (CHARACTER_IMAGE) { coreImg = new Image(); coreImg.src = CHARACTER_IMAGE; }

    ctx.beginPath(); ctx.ellipse(cx, cy + R * 1.05, R * 0.9, R * 0.25, 0, 0, TAU); ctx.fill();

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
    ctx.fillStyle = "#13206b"; ctx.fill();
    ctx.clip();
    if (coreImg && coreImg.complete && coreImg.naturalWidth) ctx.drawImage(coreImg, cx - R, cy - R, R * 2, R * 2);
    if (shieldT > 0) { ctx.globalAlpha = shieldT * 0.5; ctx.fillStyle = "#ff3b3b"; ctx.fillRect(cx - R, cy - R, R * 2, R * 2); ctx.globalAlpha = 1; }

  }

  function drawProjectiles() {

  function jagged(p, q, amp, out) {

          ctx.fillStyle = "rgba(255,255,255,0.55)";

        const k = 1 - b.age / 0.25, along = i / blade.length;
        ctx.strokeStyle = rgba(col.c, 0.55 * k); ctx.lineWidth = (6 + 18 * along) * k;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${k})`; ctx.lineWidth = (2 + 6 * along) * k;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      const h = blade[blade.length - 1];
      ctx.drawImage(glow("#ffffff"), h.x - 16, h.y - 16, 32, 32);
      ctx.globalCompositeOperation = "source-over";
    }
  }

  // ---- Input -----------------------------------------------------------
  function pos(ev) { const r = canvas.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
  canvas.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    if (state !== "play" || ptr.down) return;
    const p = pos(ev);
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    Object.assign(ptr, { down: true, id: ev.pointerId, x: p.x, y: p.y, sx: p.x, sy: p.y, lx: p.x, ly: p.y, slot: -1, dragging: false });
    if (rage) { blade = [{ x: p.x, y: p.y, age: 0 }]; return; }
    const i = hitSlot(p.x, p.y, 6);
    if (i >= 0 && slots[i]) ptr.slot = i;
  });
  canvas.addEventListener("pointermove", (ev) => {
    if (!ptr.down || ev.pointerId !== ptr.id) return;
    const p = pos(ev);
    ptr.x = p.x; ptr.y = p.y;
    if (rage) slice(ptr.lx, ptr.ly, p.x, p.y);
    else if (ptr.slot >= 0 && !ptr.dragging && Math.hypot(p.x - ptr.sx, p.y - ptr.sy) > 10) ptr.dragging = true;
    ptr.lx = p.x; ptr.ly = p.y;
  });
  function release(ev, cancelled) {
    if (!ptr.down || ev.pointerId !== ptr.id) return;
    ptr.down = false;
    const from = ptr.slot;
    if (from >= 0 && slots[from] && !rage && !cancelled && state === "play") {
      if (!ptr.dragging) useSlot(from);
      else {
        const to = hitSlot(ptr.x, ptr.y, slotGap / 2 + 4);
        if (to >= 0 && to !== from) moveDie(from, to);
        else if (to < 0 && ptr.y < trayTop - 8) useSlot(from, ptr.x, ptr.y);
      }
    }
    ptr.slot = -1; ptr.dragging = false;
  }
  canvas.addEventListener("pointerup", (ev) => release(ev, false));
  canvas.addEventListener("pointercancel", (ev) => release(ev, true));
  canvas.addEventListener("contextmenu", (ev) => ev.preventDefault());
  document.addEventListener("pointerdown", () => audio(), { passive: true });
  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" || ev.key === "p") { if (state === "play") pauseGame(); else if (state === "paused") resumeGame(); return; }
    if (state !== "play" || rage) return;
    const n = parseInt(ev.key, 10);
    if (n >= 1 && n <= SLOT_COUNT) useSlot(n - 1);
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden) pauseGame(); });

  const clickSfx = (fn) => () => { sfx("click"); fn(); };
  $("playBtn").addEventListener("click", startGame);
  $("againBtn").addEventListener("click", startGame);
  $("restartBtn").addEventListener("click", startGame);
  $("pauseBtn").addEventListener("click", clickSfx(pauseGame));
  $("resumeBtn").addEventListener("click", clickSfx(resumeGame));
  $("pauseMenuBtn").addEventListener("click", clickSfx(toMenu));
  $("overMenuBtn").addEventListener("click", clickSfx(toMenu));
  $("titleSettings").addEventListener("click", clickSfx(() => openSettings("title")));
  $("pauseSettingsBtn").addEventListener("click", clickSfx(() => openSettings("pause")));
  $("settingsDone").addEventListener("click", clickSfx(closeSettings));
  $("soundSw").addEventListener("click", () => {
    settings.sound = !settings.sound; saveSettings();
    $("soundSw").setAttribute("aria-checked", String(settings.sound));
    sfx("click");
  });
  $("vibSw").addEventListener("click", () => {
    settings.vib = !settings.vib; saveSettings();
    $("vibSw").setAttribute("aria-checked", String(settings.vib));
    haptic("medium"); sfx("click");
  });

  // ---- Boot ------------------------------------------------------------
  if (tg) {
    try {
      tg.ready(); tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      if (tg.setHeaderColor) tg.setHeaderColor("#070b2a");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#070b2a");
      if (tg.BackButton) tg.BackButton.onClick(onBack);
    } catch (e) {}
  }
  if (CHARACTER_IMAGE) $("titlePortrait").src = CHARACTER_IMAGE;
  document.querySelectorAll(".die-img").forEach((img) => { img.src = dieDataURL(img.dataset.el); });
  if (document.fonts && document.fonts.load) {
    ["Baloo 2", "Vazirmatn", "Nunito"].forEach((f) => document.fonts.load(`800 20px "${f}"`).catch(() => {}));
  }

  buildEnemySprites();
  layout();
  setLang();
  reset();
  showScreen("titleScreen");
  if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
  else window.addEventListener("resize", layout);

  let last = performance.now();
  function loop(t) {
    const dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
    last = t; now = t / 1000;
    update(dt);
    render();
    if (state !== "title") updateHud();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
