name = "volya-leaderboard"
main = "worker.js"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "volya-leaderboard"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Only the game's page may call the API from a browser.
ALLOWED_ORIGIN = "https://himn7980-bot.github.io"

# The bot token is a secret, never put it in this file:
#   npx wrangler secret put BOT_TOKEN
