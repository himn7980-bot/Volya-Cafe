# Builds an installable Android APK of the IOU app and publishes it as a GitHub Release.
# Latest APK: https://github.com/himn7980-bot/Volya-Cafe/releases/latest/download/IOU.apk
name: IOU Android APK

on:
  push:
    branches: [ccr-38f6b8a2-6km034]
    paths: ['iou/**', '.github/workflows/iou-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iou-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: iou
    env:
      # Public by design: the anon key ships inside every app build; Row Level Security protects the data.
      EXPO_PUBLIC_SUPABASE_URL: https://vikgqzehhwparfjumsut.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpa2dxemVoaHdwYXJmanVtc3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNjYxNTQsImV4cCI6MjEwNzY0MjE1NH0.Jow62lhCZS1Y-fNERfK7RMP-qcuqK8FGzOEOipNg3J0
      EAS_PROJECT_ID: 3553ce61-f780-4511-bc50-32c2213649a9
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iou/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Sign with the public test key
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  iouTest {
                      storeFile file("../../android-test-signing/iou-test.keystore")
                      storePassword "iou-test-only"
                      keyAlias "iou-test"
                      keyPassword "iou-test-only"
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.iouTest }
              }
          }
          GRADLE
      - name: Build the APK
        working-directory: iou/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Dorg.gradle.jvmargs=-Xmx6g
      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk IOU.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: iou-build-${{ github.run_number }}
          name: IOU test build ${{ github.run_number }}
          body: |
            Android test build of IOU from ${{ github.sha }}.
            Download **IOU.apk** below and open it on the phone to install.
          files: iou/IOU.apk
          make_latest: true
