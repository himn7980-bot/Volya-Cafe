<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Volya Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one phone-width column. Sticky coin header, the cafe scene, a big Work button, then the upgrade shop. */
:root {
  --bg: #2a1a13;          /* cocoa night */
  --bg-2: #3a251b;        /* panel */
  --bg-3: #4a2f22;        /* raised panel */
  --line: #5e3d2c;
  --fg: #fbeedd;          /* steamed milk */
  --fg-dim: #c9ab92;
  --honey: #ffb547;       /* coins */
  --honey-deep: #e08a1e;
  --caramel: #d9773a;     /* accent */
  --mint: #7fd6a6;        /* affordable / positive */
  --mint-deep: #2f8f63;
  --wall: #6b3f2a;
  --wall-2: #7d4a32;
  --floor: #8a5a3b;
  --floor-2: #7a4e32;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  background-image: radial-gradient(120% 60% at 50% -10%, #4b2c1d 0%, var(--bg) 60%);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 0 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ---------- Header / coin counter ---------- */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  padding-block: 14px 12px;
  background: linear-gradient(var(--bg) 78%, transparent);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.brand {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--fg-dim);
}
.counter {
  display: flex;
  align-items: center;
  gap: 10px;
  transition: transform .15s ease;
}
.counter.bump { transform: scale(1.06); }
.coin { display: inline-block;
  width: 34px; height: 34px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffe3a3 0 18%, var(--honey) 40%, var(--honey-deep) 100%);
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.18), inset 0 -3px 0 rgba(0,0,0,.18), 0 3px 10px rgba(255,181,71,.35);
  position: relative;
  flex: none;
}
.coin::after {
  content: ""; position: absolute; inset: 8px; border-radius: 50%;
  border: 2px solid rgba(122,62,6,.45);
}
.coin.sm { width: 16px; height: 16px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
.coin.sm::after { inset: 4px; border-width: 1.5px; }
#coins {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(40px, 12vw, 54px);
  line-height: 1;
  color: var(--honey);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 0 #8a4a0c, 0 6px 22px rgba(255,181,71,.25);
}
.rates {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  font-size: 13px; font-weight: 700;
  color: var(--fg-dim);
  font-variant-numeric: tabular-nums;
}
.chip b { color: var(--fg); font-weight: 800; }
.chip.boost b { color: var(--mint); }

/* ---------- Cafe scene ---------- */
.scene {
  position: relative;
  aspect-ratio: 4 / 3.2;
  max-width: 100%;
  border-radius: 22px;
  overflow: hidden;
  border: 3px solid #1f130d;
  box-shadow: 0 14px 30px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.04);
  background:
    repeating-linear-gradient(90deg, var(--wall) 0 34px, var(--wall-2) 34px 36px);
  user-select: none;
}
.floor {
  position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
  background:
    repeating-linear-gradient(90deg, transparent 0 58px, rgba(0,0,0,.14) 58px 60px),
    linear-gradient(var(--floor), var(--floor-2));
  border-top: 5px solid #5a3522;
}
.window {
  position: absolute; top: 9%; left: 8%; width: 26%; aspect-ratio: 1 / 1.1;
  background: linear-gradient(#1d2a4a, #3b3466 70%, #6a4a6a);
  border: 5px solid #4a2b1c; border-radius: 10px 10px 4px 4px;
  overflow: hidden;
}
.window::before { /* moon */
  content: ""; position: absolute; top: 14%; right: 16%; width: 22%; aspect-ratio: 1; border-radius: 50%;
  background: #fff3cf; box-shadow: 0 0 14px #fff3cf;
}
.window::after { /* mullions */
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent calc(50% - 2px), #4a2b1c calc(50% - 2px) calc(50% + 2px), transparent calc(50% + 2px)),
              linear-gradient(transparent calc(50% - 2px), #4a2b1c calc(50% - 2px) calc(50% + 2px), transparent calc(50% + 2px));
}
.sign {
  position: absolute; top: 9%; right: 7%;
  padding: 6px 12px;
  background: #1f130d;
  border: 2px solid var(--caramel);
  border-radius: 10px;
  font-family: var(--font-display); font-weight: 800; font-size: clamp(13px, 3.6vw, 16px);
  color: var(--honey);
  letter-spacing: .06em;
  text-shadow: 0 0 10px rgba(255,181,71,.6);
}
.sign small { display: block; font-size: 10px; letter-spacing: .14em; color: var(--fg-dim); text-shadow: none; text-align: center; }
.lights {
  position: absolute; top: 0; left: 0; right: 0; height: 18px;
  background: radial-gradient(circle at 50% 70%, #ffd27a 0 3px, transparent 4px) 0 0 / 28px 18px repeat-x;
  filter: drop-shadow(0 0 4px #ffb547);
  opacity: .9;
}

/* Character #1 placeholder */
.hero {
  position: absolute; left: 50%; bottom: 14%;
  width: 34%; aspect-ratio: 1;
  transform: translateX(-50%);
  z-index: 2;
}
.hero-body {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 35%, #3355d8, #1d2f8f 70%);
  border: 4px solid #ffe3a3;
  box-shadow: 0 0 0 4px #c8341f, 0 10px 0 rgba(0,0,0,.25), 0 0 26px rgba(255,181,71,.35);
  display: grid; place-items: center;
  overflow: hidden;
  animation: idle 2.4s ease-in-out infinite;
  cursor: pointer;
}
.hero-body img { width: 100%; height: 100%; object-fit: cover; }
.hero-tag {
  font-family: var(--font-display); font-weight: 800;
  color: #fff; text-align: center; line-height: 1.05;
  font-size: clamp(12px, 3.6vw, 16px);
  text-shadow: 0 2px 0 rgba(0,0,0,.35);
}
.hero-tag span { display: block; font-size: .7em; letter-spacing: .12em; opacity: .8; }
.hero.working .hero-body { animation: work .3s ease-out, idle 2.4s ease-in-out .3s infinite; }
.shadow {
  position: absolute; left: 50%; bottom: 10%; width: 28%; height: 5%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.3); border-radius: 50%;
  z-index: 1;
}
@keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5%) } }
@keyframes work { 0% { transform: scale(1) } 40% { transform: scale(1.1, .9) } 100% { transform: scale(1) } }

/* Expansion props (hidden until bought) */
.prop { position: absolute; z-index: 1; transform-origin: bottom center; }
.prop.pop { animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(0) } to { transform: scale(1) } }
.desk { left: 4%; bottom: 12%; width: 27%; height: 20%; }
.desk::before { /* top */
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 22%;
  background: #c98a55; border-radius: 6px; box-shadow: 0 3px 0 #8a5530;
}
.desk::after { /* legs + laptop */
  content: ""; position: absolute; left: 8%; right: 8%; top: 22%; bottom: 0;
  background: linear-gradient(90deg, #8a5530 0 10%, transparent 10% 90%, #8a5530 90%);
}
.desk i { /* laptop */
  position: absolute; left: 30%; bottom: 100%; width: 40%; height: 55%;
  background: #cfd8e8; border-radius: 4px 4px 0 0; border: 3px solid #4b5568; border-bottom: 0;
  box-shadow: inset 0 0 10px #7fb0ff;
}
.plant { right: 7%; bottom: 12%; width: 15%; height: 36%; }
.plant::before { /* pot */
  content: ""; position: absolute; left: 15%; right: 15%; bottom: 0; height: 32%;
  background: linear-gradient(#d9773a, #a9542a); border-radius: 4px 4px 10px 10px;
}
.plant i, .plant b {
  position: absolute; bottom: 28%; width: 46%; height: 70%;
  background: #4fae6e; border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
  border: 2px solid #2f7a4a;
}
.plant i { left: 4%; transform: rotate(-18deg); }
.plant b { right: 4%; transform: rotate(18deg); background: #5fc07e; }
.machine { right: 28%; top: 40%; width: 13%; height: 22%; z-index: 0; }
.machine::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(#b8bec9, #7f8794); border-radius: 6px 6px 3px 3px;
  box-shadow: inset 0 -6px 0 #5b626e;
}
.machine::after { /* cup */
  content: ""; position: absolute; left: 30%; bottom: 10%; width: 40%; height: 26%;
  background: #fbeedd; border-radius: 0 0 6px 6px;
}
.machine i { /* steam */
  position: absolute; left: 40%; bottom: 100%; width: 20%; height: 40%;
  border-left: 3px solid rgba(255,255,255,.55); border-radius: 50%;
  animation: steam 2s ease-in-out infinite;
}
@keyframes steam { 0% { opacity: 0; transform: translateY(6px) } 50% { opacity: 1 } 100% { opacity: 0; transform: translateY(-8px) } }
.rug {
  left: 50%; bottom: 6%; width: 54%; height: 12%; transform: translateX(-50%);
  background: repeating-linear-gradient(90deg, #c8341f 0 12px, #e0573a 12px 24px);
  border-radius: 50%; opacity: .9; z-index: 0;
}
.rug.pop { animation: rugpop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes rugpop { from { transform: translateX(-50%) scale(0) } to { transform: translateX(-50%) scale(1) } }

/* Floating numbers */
.float {
  position: absolute; z-index: 4; pointer-events: none;
  font-family: var(--font-display); font-weight: 800; font-size: 22px;
  color: var(--honey);
  text-shadow: 0 2px 0 #6b3507, 0 0 10px rgba(0,0,0,.4);
  animation: rise 1.1s ease-out forwards;
  white-space: nowrap;
}
.float.big { font-size: 28px; color: #fff3cf; }
@keyframes rise {
  0% { opacity: 0; transform: translate(-50%, 0) scale(.6) }
  15% { opacity: 1; transform: translate(-50%, -10px) scale(1.1) }
  100% { opacity: 0; transform: translate(-50%, -70px) scale(1) }
}

/* ---------- Work button ---------- */
.work {
  appearance: none; border: 0; cursor: pointer;
  width: 100%;
  padding: 16px 20px 18px;
  border-radius: 18px;
  background: linear-gradient(#ffc966, var(--honey) 45%, var(--honey-deep));
  color: #4a2304;
  font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1;
  box-shadow: 0 6px 0 #a35c0e, 0 12px 20px rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .06s, box-shadow .06s;
  touch-action: manipulation;
}
.work small { font-family: var(--font-body); font-size: 15px; font-weight: 800; opacity: .8; }
.work:active { transform: translateY(5px); box-shadow: 0 1px 0 #a35c0e, 0 4px 10px rgba(0,0,0,.35); }
.work:focus-visible, .buy:focus-visible, .link:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }

/* ---------- Shop ---------- */
.shop-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.shop-head h2 {
  margin: 0;
  font-family: var(--font-display); font-weight: 800; font-size: 22px;
  text-wrap: balance;
}
.shop-head p { margin: 0; color: var(--fg-dim); font-size: 13px; }
.shop { display: flex; flex-direction: column; gap: 10px; }
.item {
  display: grid;
  grid-template-columns: 52px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  position: relative;
  overflow: hidden;
}
.item .icon {
  width: 52px; height: 52px; border-radius: 14px;
  background: var(--bg-3);
  display: grid; place-items: center;
}
.item .icon svg { width: 32px; height: 32px; }
.item .info { min-width: 0; }
.item h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.15; }
.item .lvl { font-family: var(--font-body); font-size: 12px; font-weight: 800; color: var(--fg-dim); margin-left: 4px; }
.item p { margin: 2px 0 0; font-size: 13px; color: var(--fg-dim); line-height: 1.3; }
.item p b { color: var(--mint); }
.progress {
  position: absolute; left: 0; bottom: 0; height: 3px;
  background: var(--honey); opacity: .6;
  transition: width .3s;
}
.buy {
  appearance: none; border: 0; cursor: pointer;
  min-width: 84px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--mint);
  color: #0f3a26;
  font-family: var(--font-display); font-weight: 800; font-size: 16px; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 4px 0 var(--mint-deep);
  font-variant-numeric: tabular-nums;
  transition: transform .06s, box-shadow .06s, background .2s;
  touch-action: manipulation;
}
.buy:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--mint-deep); }
.buy:disabled { background: var(--bg-3); color: var(--fg-dim); box-shadow: 0 4px 0 #24160f; cursor: not-allowed; }
.buy.maxed { background: transparent; color: var(--mint); box-shadow: none; border: 1px dashed var(--mint-deep); }

/* ---------- Footer ---------- */
.foot {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  color: var(--fg-dim); font-size: 12px;
}
.link {
  appearance: none; background: none; border: 0; padding: 4px 0; cursor: pointer;
  color: var(--fg-dim); font: inherit; text-decoration: underline; text-underline-offset: 3px;
}
.confirm { display: inline-flex; gap: 10px; align-items: center; }
.confirm .link.danger { color: #ff8a70; }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 20px); opacity: 0;
  background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 12px;
  font-weight: 800; font-size: 14px;
  box-shadow: 0 10px 24px rgba(0,0,0,.4);
  transition: opacity .25s, transform .25s;
  z-index: 20; pointer-events: none;
  max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .hero-body, .machine i { animation: none !important; }
  .float { animation-duration: .6s; }
  .prop.pop, .rug.pop { animation: none; }
}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Volya Cafe</div>
    <div class="counter" id="counter">
      <div class="coin" aria-hidden="true"></div>
      <div id="coins">0</div>
    </div>
    <div class="rates">
      <span class="chip"><span class="coin sm"></span><b id="perSec">1</b>/sec</span>
      <span class="chip"><b id="perTap">+5</b>per work</span>
      <span class="chip boost" id="boostChip" hidden><b id="boost">+50%</b>camp bonus</span>
    </div>
  </header>

  <section class="scene" id="scene" aria-label="The cafe">
    <div class="lights"></div>
    <div class="window"></div>
    <div class="sign">VOLYA<small>CAFE</small></div>
    <div class="floor"></div>
    <div class="prop rug" id="prop-rug" hidden></div>
    <div class="prop machine" id="prop-machine" hidden><i></i></div>
    <div class="prop desk" id="prop-desk" hidden><i></i></div>
    <div class="prop plant" id="prop-plant" hidden><i></i><b></b></div>
    <div class="shadow"></div>
    <div class="hero" id="hero">
      <!-- Character #1 placeholder. Set CHARACTER_IMAGE in the script to show your art here. -->
      <div class="hero-body" id="heroBody">
        <div class="hero-tag">VOLYA<span>#1</span></div>
      </div>
    </div>
  </section>

  <button class="work" id="workBtn" type="button">Work <small id="workLabel">+5</small></button>

  <section>
    <div class="shop-head">
      <h2>Upgrades</h2>
      <p>Prices rise with each level</p>
    </div>
    <div class="shop" id="shop"></div>
  </section>

  <footer class="foot">
    <span id="saveNote">Progress saves on this device</span>
    <span id="resetWrap"><button class="link" id="resetBtn" type="button">Reset progress</button></span>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  // ---- Config ----------------------------------------------------------
  // Put your character art here (a URL or data: URI) to replace the placeholder circle.
  const CHARACTER_IMAGE = "";
  const SAVE_KEY = "volya-cafe-save-v1";
  const OFFLINE_CAP_SEC = 2 * 60 * 60; // offline earnings for at most 2 hours

  const UPGRADES = [
    {
      id: "energy", name: "Energy Drink", baseCost: 50, growth: 1.55, max: Infinity,
      desc: (l) => `Volya works faster: <b>+1 coin/sec</b>`,
      icon: '<svg viewBox="0 0 32 32"><rect x="9" y="5" width="14" height="24" rx="3" fill="#7fd6a6"/><rect x="9" y="5" width="14" height="4" rx="1.5" fill="#cfd8e8"/><path d="M17 11l-4 7h3l-1 6 4-8h-3z" fill="#2a1a13"/></svg>'
    },
    {
      id: "tools", name: "Better Tools", baseCost: 150, growth: 1.6, max: Infinity,
      desc: (l) => `Each Work tap pays <b>+5 more</b>`,
      icon: '<svg viewBox="0 0 32 32"><rect x="14" y="12" width="4" height="17" rx="2" fill="#c98a55" transform="rotate(-35 16 20)"/><path d="M8 7h12a3 3 0 010 6H8z" fill="#cfd8e8" transform="rotate(-35 16 10)"/></svg>'
    },
    {
      id: "expand", name: "Expand Camp", baseCost: 500, growth: 3, max: 4,
      desc: (l) => l < 4
        ? `Adds a ${["desk", "plant", "coffee machine", "rug"][l]} and <b>+50% all coins</b>`
        : `Camp fully expanded: <b>+200% all coins</b>`,
      icon: '<svg viewBox="0 0 32 32"><path d="M4 15L16 5l12 10v13H4z" fill="#d9773a"/><rect x="13" y="19" width="6" height="9" fill="#2a1a13"/><path d="M2 16L16 4l14 12" stroke="#ffb547" stroke-width="3" fill="none" stroke-linecap="round"/></svg>'
    }
  ];
  const PROPS = ["prop-desk", "prop-plant", "prop-machine", "prop-rug"];

  // ---- State -----------------------------------------------------------
  const fresh = () => ({ coins: 0, lifetime: 0, levels: { energy: 0, tools: 0, expand: 0 }, savedAt: Date.now() });
  let state = fresh();
  let shown = 0;

  const perSecBase = () => 1 + state.levels.energy;
  const perTapBase = () => 5 + 5 * state.levels.tools;
  const multiplier = () => 1 + 0.5 * state.levels.expand;
  const perSec = () => perSecBase() * multiplier();
  const perTap = () => perTapBase() * multiplier();
  const costOf = (u) => Math.round(u.baseCost * Math.pow(u.growth, state.levels[u.id]));

  // ---- Helpers ---------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  function fmt(n) {
    n = Math.floor(n);
    if (n < 10000) return n.toLocaleString("en-US");
    const units = [["T", 1e12], ["B", 1e9], ["M", 1e6], ["K", 1e3]];
    for (const [s, v] of units) if (n >= v) return (n / v).toFixed(n / v < 100 ? 1 : 0).replace(/\.0$/, "") + s;
    return String(n);
  }
  const fmtRate = (n) => (Number.isInteger(n) ? fmt(n) : n < 100 ? n.toFixed(1).replace(/\.0$/, "") : fmt(n));

  const tg = window.Telegram && window.Telegram.WebApp;
  function haptic(kind) {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (kind === "buy") tg.HapticFeedback.notificationOccurred("success");
      else tg.HapticFeedback.impactOccurred("light");
    } catch (e) {}
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // ---- Floating numbers ------------------------------------------------
  const scene = $("scene");
  function floatText(text, xPct, yPct, big) {
    const el = document.createElement("div");
    el.className = "float" + (big ? " big" : "");
    el.textContent = text;
    el.style.left = xPct + "%";
    el.style.top = yPct + "%";
    el.addEventListener("animationend", () => el.remove());
    scene.appendChild(el);
  }
  const jitter = (base, spread) => base + (Math.random() - 0.5) * spread;

  // ---- Earning ---------------------------------------------------------
  function earn(amount) {
    state.coins += amount;
    state.lifetime += amount;
    const c = $("counter");
    c.classList.remove("bump");
    void c.offsetWidth;
    c.classList.add("bump");
    setTimeout(() => c.classList.remove("bump"), 150);
    renderShop();
  }

  function work() {
    const amt = perTap();
    earn(amt);
    floatText("+" + fmtRate(amt), jitter(50, 30), jitter(40, 12), true);
    const hero = $("hero");
    hero.classList.remove("working");
    void hero.offsetWidth;
    hero.classList.add("working");
    haptic("tap");
  }

  function buy(u) {
    const lvl = state.levels[u.id];
    if (lvl >= u.max) return;
    const cost = costOf(u);
    if (state.coins < cost) return;
    state.coins -= cost;
    state.levels[u.id] = lvl + 1;
    haptic("buy");
    if (u.id === "expand") {
      const el = $(PROPS[lvl]);
      el.hidden = false;
      el.classList.add("pop");
      toast("Camp expanded! All coins +50%");
    } else {
      toast(`${u.name} is now level ${lvl + 1}`);
    }
    renderStats();
    renderShop();
    save();
  }

  // ---- Rendering -------------------------------------------------------
  function renderStats() {
    $("perSec").textContent = fmtRate(perSec());
    $("perTap").textContent = "+" + fmtRate(perTap());
    $("workLabel").textContent = "+" + fmtRate(perTap());
    const lvl = state.levels.expand;
    $("boostChip").hidden = lvl === 0;
    $("boost").textContent = "+" + lvl * 50 + "%";
  }

  function buildShop() {
    const shop = $("shop");
    shop.innerHTML = "";
    for (const u of UPGRADES) {
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML =
        `<div class="icon" aria-hidden="true">${u.icon}</div>` +
        `<div class="info"><h3>${u.name}<span class="lvl"></span></h3><p></p></div>` +
        `<button class="buy" type="button" id="buy-${u.id}"></button>` +
        `<div class="progress"></div>`;
      row.querySelector("button").addEventListener("click", () => buy(u));
      shop.appendChild(row);
      u.el = row;
    }
    renderShop();
  }

  function renderShop() {
    for (const u of UPGRADES) {
      if (!u.el) continue;
      const lvl = state.levels[u.id];
      const maxed = lvl >= u.max;
      const cost = costOf(u);
      u.el.querySelector(".lvl").textContent = lvl ? "Lv " + lvl : "";
      u.el.querySelector("p").innerHTML = u.desc(lvl);
      const btn = u.el.querySelector("button");
      const bar = u.el.querySelector(".progress");
      if (maxed) {
        btn.className = "buy maxed";
        btn.disabled = true;
        btn.textContent = "Maxed";
        bar.style.width = "0";
      } else {
        btn.className = "buy";
        btn.disabled = state.coins < cost;
        const label = `<span class="coin sm" aria-hidden="true"></span>${fmt(cost)}`;
        if (btn.dataset.label !== label) { btn.innerHTML = label; btn.dataset.label = label; }
        btn.setAttribute("aria-label", `Buy ${u.name} for ${cost} coins`);
        bar.style.width = Math.min(100, (state.coins / cost) * 100) + "%";
      }
    }
  }

  function renderProps() {
    PROPS.forEach((id, i) => { $(id).hidden = i >= state.levels.expand; });
  }

  // Smoothly roll the big counter toward the real value.
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    const diff = state.coins - shown;
    shown = Math.abs(diff) < 0.5 ? state.coins : shown + diff * Math.min(1, dt * 9);
    $("coins").textContent = fmt(shown);
    requestAnimationFrame(frame);
  }

  // ---- Persistence -----------------------------------------------------
  function save() {
    state.savedAt = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (typeof s.coins !== "number" || !s.levels) return null;
      return Object.assign(fresh(), s, { levels: Object.assign(fresh().levels, s.levels) });
    } catch (e) { return null; }
  }

  // ---- Reset (inline confirm; dialogs are not available) ----------------
  function showReset() {
    $("resetWrap").innerHTML = '<button class="link" id="resetBtn" type="button">Reset progress</button>';
    $("resetBtn").addEventListener("click", () => {
      $("resetWrap").innerHTML =
        '<span class="confirm">Erase everything? <button class="link danger" id="yesReset" type="button">Erase</button>' +
        '<button class="link" id="noReset" type="button">Keep</button></span>';
      $("yesReset").addEventListener("click", () => {
        state = fresh(); shown = 0;
        renderProps(); renderStats(); renderShop(); save(); showReset();
        toast("Progress reset");
      });
      $("noReset").addEventListener("click", showReset);
    });
  }

  // ---- Boot ------------------------------------------------------------
  function start(hotData) {
    if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

    if (CHARACTER_IMAGE) {
      $("heroBody").innerHTML = `<img src="${CHARACTER_IMAGE}" alt="Volya, character #1">`;
    }

    const saved = (hotData && hotData.state) || load();
    if (saved) {
      state = saved;
      const away = Math.min(OFFLINE_CAP_SEC, Math.max(0, (Date.now() - state.savedAt) / 1000));
      if (!hotData?.state && away > 30) {
        const gained = Math.floor(away * perSec());
        if (gained > 0) {
          state.coins += gained;
          state.lifetime += gained;
          setTimeout(() => toast(`Welcome back! Volya earned ${fmt(gained)} coins while you were away`), 400);
        }
      }
    }
    shown = state.coins;

    renderProps();
    renderStats();
    buildShop();
    showReset();

    $("workBtn").addEventListener("click", work);
    $("heroBody").addEventListener("click", work);

    // Character #1 earns every second.
    setInterval(() => {
      const amt = perSec();
      earn(amt);
      floatText("+" + fmtRate(amt), jitter(50, 14), jitter(26, 6), false);
    }, 1000);

    setInterval(save, 5000);
    document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
    window.addEventListener("pagehide", save);

    requestAnimationFrame(frame);
  }

  window.claude?.hot?.snapshot?.(() => ({ state }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
